  // ---------- SSE ----------
  function connectEvents() {
    if (!state.token || state.stopped) return;
    fetch('/api/events', { headers: { 'Authorization': 'Bearer ' + state.token } })
      .then(function (res) {
        if (res.status === 401) { logout(); return null; }
        if (!res.ok || !res.body) throw new Error('事件流不可用');
        // 断线重连后以数据库对账：先把当前会话的历史重拉一遍
        if (state.current) loadMessages();
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';
        function read() {
          return reader.read().then(function (chunk) {
            if (chunk.done) return;
            buffer += decoder.decode(chunk.value, { stream: true });
            var idx;
            while ((idx = buffer.indexOf('\n\n')) >= 0) {
              handleSseChunk(buffer.slice(0, idx));
              buffer = buffer.slice(idx + 2);
            }
            return read();
          });
        }
        return read();
      })
      .catch(function () {})
      .then(function () {
        if (state.stopped || !state.token) return;
        if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
        state.reconnectTimer = setTimeout(connectEvents, 3000);
      });
  }

  function handleSseChunk(chunk) {
    var event = 'message';
    var dataLines = [];
    chunk.split('\n').forEach(function (line) {
      if (line.indexOf(':') === 0) return; // 心跳注释
      if (line.indexOf('event:') === 0) event = line.slice(6).trim();
      else if (line.indexOf('data:') === 0) dataLines.push(line.slice(5).trim());
    });
    if (!dataLines.length) return;
    var payload;
    try { payload = JSON.parse(dataLines.join('\n')); } catch (e) { return; }
    onEvent(event, payload);
  }

  // ---------- 实时通知横幅 ----------
  // 非当前会话的回合收口/失败、外部 agent 的待审批与任务收口，弹顶部横幅提醒。
  // 成功类 8 秒自动消退；失败/待审批常驻，点 ✕ 关闭（待审批在 approval.decided 到达时自动收）。
  function sessionTitleOf(sid) {
    for (var i = 0; i < state.sessions.length; i++) {
      if (String(state.sessions[i].id) === String(sid)) return state.sessions[i].title || '未命名对话';
    }
    return '新对话';
  }
  function dirName(cwd) {
    return String(cwd || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop() || cwd || '?';
  }
  function renderTabBadge() {
    tabListBadge.textContent = state.unread > 99 ? '99+' : String(state.unread);
    tabListBadge.classList.toggle('hidden', state.unread <= 0);
  }
  function markUnread() {
    // 只有不在对话列表页时才累积角标（列表页用户直接看得到横幅）
    if (!listView.classList.contains('active')) {
      state.unread += 1;
      renderTabBadge();
    }
  }
  var NOTICE_MAX = 3;
  function pushNotice(opts) {
    if (opts.id && noticeStack.querySelector('[data-id="' + opts.id + '"]')) return;
    var el = document.createElement('div');
    el.className = 'notice ' + (opts.kind || 'ok');
    if (opts.id) el.setAttribute('data-id', opts.id);
    el.innerHTML = '<div class="n-ico">' + opts.icon + '</div>'
      + '<div class="n-body"><div class="n-title">' + escHtml(opts.title) + '</div>'
      + (opts.brief ? '<div class="n-brief">' + escHtml(opts.brief) + '</div>' : '')
      + '</div><button class="n-close" type="button">✕</button>';
    el.querySelector('.n-close').addEventListener('click', function () { removeNotice(el); });
    noticeStack.appendChild(el);
    while (noticeStack.children.length > NOTICE_MAX) removeNotice(noticeStack.firstElementChild);
    if (!opts.sticky) setTimeout(function () { removeNotice(el); }, 8000);
  }
  function removeNotice(el) {
    if (!el || !el.parentNode) return;
    el.classList.add('out');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
  }

  // 外部 agent 审批通道事件（与桌面今天页通知栈同源：approval.required / approval.decided / task-done）
  function onApproverEvent(e) {
    if (e && e.type === 'approval.required' && e.request) {
      var req = e.request;
      pushNotice({
        id: 'ap-' + req.id,
        kind: 'appr',
        icon: '🛡️',
        title: '待审批 · ' + (req.tool || '') + '（' + (req.agent || '') + '）',
        brief: req.inputSummary || '请在电脑端或飞书卡片中处理',
        sticky: true
      });
    } else if (e && e.type === 'approval.decided') {
      var apId = e.request && e.request.id;
      if (apId) removeNotice(noticeStack.querySelector('[data-id="ap-' + apId + '"]'));
    } else if (e && e.type === 'task-done' && e.report) {
      var r = e.report;
      var ok = r.ok !== false;
      pushNotice({
        kind: ok ? 'ok' : 'err',
        icon: ok ? '✅' : '❌',
        title: (ok ? '任务完成' : '任务失败') + ' · ' + dirName(r.cwd) + '（' + (r.agent || '') + '）',
        brief: String(ok ? (r.task || '') : (r.error || r.task || '')).replace(/\s+/g, ' ').trim().slice(0, 120),
        sticky: !ok
      });
      if (!ok) markUnread();
    }
  }

  function onEvent(event, data) {
    if (event === 'approver:event') return onApproverEvent(data);

    var sid = String(data && data.sessionId || '');
    if (!sid) return;

    // 当前会话：流式事件由对话页自己渲染（原有逻辑）
    if (sid === state.current) {
      if (event === 'chat:delta') {
        appendText(String(data.text || ''));
        statusEl.textContent = '';
      } else if (event === 'chat:thinking') {
        appendThinking(String(data.text || ''));
      } else if (event === 'chat:tool') {
        showTool(data);
      } else if (event === 'chat:status') {
        statusEl.textContent = String(data.text || '');
      } else if (event === 'chat:done') {
        state.streaming = false;
        statusEl.textContent = '';
        finalizeLive();
        updateSendState();
        loadMessages();
        loadSessions();
      } else if (event === 'chat:error') {
        state.streaming = false;
        statusEl.textContent = '';
        finalizeLive();
        updateSendState();
        messagesEl.appendChild(bubbleWrap('system', String(data.text || '回答失败')));
        scrollBottom();
      }
      return;
    }

    // 非当前会话：delta/tool 等中间事件太吵不打扰，只在回合收口时弹横幅
    if (event === 'chat:done') {
      pushNotice({ kind: 'ok', icon: '✅', title: 'AI 回答完成 · ' + sessionTitleOf(sid), brief: '' });
      markUnread();
    } else if (event === 'chat:error') {
      pushNotice({
        kind: 'err', icon: '⚠️',
        title: '回答失败 · ' + sessionTitleOf(sid),
        brief: String(data.text || '').replace(/\s+/g, ' ').trim().slice(0, 120),
        sticky: true
      });
      markUnread();
    }
  }

  // ---------- 首页（今天页移动版） ----------
  // GET /api/today 聚合：本地待办 + 笔记提炼待办 + 雷达工具卡片/最近会话 + 工作日志（最近更新文档）。
  // GET /api/brief：昨日简报，与桌面今天页同一生成/缓存链路（内存 → 落盘恢复 → 生成）。
  // 每次切到首页 Tab 重新拉取，数据量小、无需本地缓存。
  var homeLoading = false;
  var homeTodosExpanded = false;
  var homeData = null;

  // 昨日简报：缓存命中即回（毫秒级），缺失才现场生成（首次约十几秒）；⟳ 强制重新生成
  var homeBriefLoading = false;
  function loadHomeBrief(force) {
    if (homeBriefLoading) return;
    homeBriefLoading = true;
    homeBriefMeta.textContent = force ? '重新生成中…' : '加载中…';
    if (!homeBrief.innerHTML) homeBrief.appendChild(emptyNode('正在汇总昨日 AI 工具动态与笔记库…'));
    request('/api/brief' + (force ? '?force=1' : '')).then(function (r) {
      homeBriefLoading = false;
      homeBrief.innerHTML = '';
      if (r && r.ok && r.brief) {
        homeBrief.innerHTML = mdRender(r.brief);
        homeBriefMeta.textContent = 'AI 生成 · ' + (r.generatedAt || '');
      } else if (r && r.empty) {
        homeBrief.appendChild(emptyNode('昨天没有 AI 会话与笔记更新'));
        homeBriefMeta.textContent = '';
      } else {
        homeBrief.appendChild(emptyNode((r && r.error) ? '简报生成失败：' + r.error : '简报生成失败'));
        homeBriefMeta.textContent = '';
      }
    }).catch(function (e) {
      homeBriefLoading = false;
      homeBrief.innerHTML = '';
      homeBrief.appendChild(emptyNode(e.message || '简报加载失败'));
      homeBriefMeta.textContent = '';
    });
  }
  homeBriefRefresh.addEventListener('click', function () { loadHomeBrief(true); });

  function fmtHomeTime(ts) {
    var n = Number(ts);
    if (!n) return '';
    var d = new Date(n);
    var now = new Date();
    var pad = function (x) { return (x < 10 ? '0' : '') + x; };
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if (d.toDateString() === now.toDateString()) return '今天 ' + hm;
    if (new Date(now - 86400000).toDateString() === d.toDateString()) return '昨天 ' + hm;
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  }
  function todayStrLocal() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate();
  }
  function enterHome() {
    show(homeView);
    loadToday();
    loadHomeBrief(false);
  }
  function loadToday() {
    if (homeLoading) return;
    homeLoading = true;
    var d = new Date();
    homeDate.textContent = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()]
      + ' · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    homeTodos.innerHTML = '';
    homeTodos.appendChild(emptyNode('加载中…'));
    request('/api/today').then(function (data) {
      homeLoading = false;
      homeData = data || {};
      renderHome(homeData);
    }).catch(function () {
      homeLoading = false;
      homeTodos.innerHTML = '';
      homeTodos.appendChild(emptyNode('加载失败，重新切到首页可重试'));
    });
  }

  function renderHome(data) {
    var todos = data.todos || [];
    var digestTodos = data.digestTodos || [];
    var total = todos.length + digestTodos.length;
    homeTodoCount.textContent = total ? total + ' 项' : '';

    // 等你处理：本地待办（逾期标黄）+ 笔记提炼待办（带来源文件）
    homeTodos.innerHTML = '';
    if (!total) {
      homeTodos.appendChild(emptyNode('暂时没有需要你动手的事'));
    } else {
      var today = todayStrLocal();
      todos.forEach(function (t) {
        var row = document.createElement('div');
        row.className = 'home-row click';
        var overdue = t.due_date && String(t.due_date) < today;
        row.innerHTML = '<div class="dot' + (overdue ? ' warn' : '') + '"></div>'
          + '<div class="tx">' + escHtml(String(t.title || '')) + '</div>'
          + (t.due_date ? '<div class="tm">' + escHtml(String(t.due_date)) + '</div>' : '');
        row.addEventListener('click', function () { openTodoSheet('local', t); });
        homeTodos.appendChild(row);
      });
      digestTodos.forEach(function (t) {
        var row = document.createElement('div');
        row.className = 'home-row click';
        var fname = String(t.file || '').split(/[\\/]/).pop() || '';
        row.innerHTML = '<div class="dot"></div>'
          + '<div class="tx">' + escHtml(String(t.text || '')) + '<div class="sub">📝 ' + escHtml(fname) + '</div></div>';
        row.addEventListener('click', function () { openTodoSheet('digest', t); });
        homeTodos.appendChild(row);
      });
    }

    // 折叠：默认最多 5 条，点「展开更多」看全部，展开状态跨刷新保留
    var rows = [].slice.call(homeTodos.children);
    if (rows.length > 5) {
      rows.forEach(function (el, i) { el.classList.toggle('hidden', i >= 5 && !homeTodosExpanded); });
      var fold = document.createElement('div');
      fold.className = 'home-empty tap';
      fold.textContent = homeTodosExpanded ? '收起' : '展开更多（还有 ' + (rows.length - 5) + ' 条）';
      fold.addEventListener('click', function () {
        homeTodosExpanded = !homeTodosExpanded;
        if (homeData) renderHome(homeData);
      });
      homeTodos.appendChild(fold);
    }

    // AI 工具动态：一行 2 卡，运行中会话标绿
    var cards = (data.radar && data.radar.cards) || [];
    homeRadarHint.textContent = (data.radar && data.radar.enabled === false) ? '雷达未开启' : '';
    homeToolCards.innerHTML = '';
    if (!cards.length) {
      var em = document.createElement('div');
      em.className = 'home-empty';
      em.textContent = '还没有采集到 AI 会话';
      homeToolCards.appendChild(em);
    } else {
      cards.forEach(function (c) {
        var el = document.createElement('div');
        el.className = 'tool-card';
        el.innerHTML = '<div class="tc-name">' + escHtml(String(c.tool || '')) + '</div>'
          + '<div class="tc-num">' + Number(c.sessions || 0) + '</div>'
          + '<div class="tc-sub">会话' + (Number(c.running) > 0 ? ' · <span class="tc-run">运行中</span>' : '') + '</div>';
        homeToolCards.appendChild(el);
      });
    }

    // 最近活跃会话：运行中的排前（服务端已排序），标题 + 工具徽标 + 时间
    var sessions = (data.radar && data.radar.sessions) || [];
    homeSessions.innerHTML = '';
    if (!sessions.length) {
      homeSessions.appendChild(emptyNode('暂无活跃会话'));
    } else {
      sessions.forEach(function (s) {
        var row = document.createElement('div');
        row.className = 'home-row click';
        var run = String(s.state) === 'running';
        row.innerHTML = '<span class="home-badge">' + escHtml(String(s.tool || '')) + '</span>'
          + '<div class="tx">' + escHtml(String(s.title || '（无标题会话）')) + '</div>'
          + (run ? '<div class="dot run"></div>' : '<div class="tm">' + fmtHomeTime(s.sourceUpdatedAt) + '</div>');
        row.addEventListener('click', function () { openRadarSession(s.tool, s.sessionId, s.title); });
        homeSessions.appendChild(row);
      });
    }

    // 工作日志：笔记库最近更新的文档流
    var files = data.recentFiles || [];
    homeFiles.innerHTML = '';
    if (!files.length) {
      homeFiles.appendChild(emptyNode('笔记库还没有更新'));
    } else {
      files.forEach(function (f) {
        var row = document.createElement('div');
        row.className = 'home-row click';
        var fname = String(f.rel || '').split(/[\\/]/).pop() || '';
        row.innerHTML = '<div class="dot"></div>'
          + '<div class="tx">' + escHtml(fname) + '<div class="sub">' + escHtml(String(f.projectName || '')) + '</div></div>'
          + '<div class="tm">' + fmtHomeTime(f.mtime) + '</div>';
        row.addEventListener('click', function () { openHomeDoc(f); });
        homeFiles.appendChild(row);
      });
    }
  }

  // ---------- 首页交互：会话详情 / 文档阅读 / 待办勾选 ----------
  // 会话详情（只读）：连续助手消息合并为一块，思考过程折叠，工具调用暂不展示
  function openRadarSession(tool, sessionId, title) {
    rdTitle.textContent = String(title || '会话');
    rdMessages.innerHTML = '';
    rdMessages.appendChild(emptyNode('加载中…'));
    show(rdView);
    pushScreen('radarSession');
    request('/api/radar/messages?tool=' + encodeURIComponent(String(tool || '')) + '&sessionId=' + encodeURIComponent(String(sessionId || '')))
      .then(function (data) { renderRadarMessages((data && data.messages) || []); })
      .catch(function (e) {
        rdMessages.innerHTML = '';
        rdMessages.appendChild(emptyNode(e.message || '加载失败'));
      });
  }
  function backFromRd() {
    if (history.state && history.state.screen) history.back();
    else show(homeView);
  }
  function renderRadarMessages(msgs) {
    rdMessages.innerHTML = '';
    if (!msgs.length) { rdMessages.appendChild(emptyNode('没有消息')); return; }
    // 连续非用户消息合并为一块（与桌面会话详情同一策略）
    var blocks = [];
    msgs.forEach(function (m) {
      var last = blocks[blocks.length - 1];
      if (last && last.role !== 'user' && String(m.role) !== 'user') last.items.push(m);
      else blocks.push({ role: String(m.role || 'assistant'), items: [m] });
    });
    blocks.forEach(function (b) {
      if (b.role === 'user') {
        b.items.forEach(function (m) {
          var el = document.createElement('div');
          el.className = 'rd-user';
          el.textContent = String(m.content || '');
          rdMessages.appendChild(el);
        });
        return;
      }
      var wrap = document.createElement('div');
      wrap.className = 'rd-ai';
      var html = '';
      b.items.forEach(function (m) {
        var think = String(m.thinking || '').trim();
        if (think) {
          html += '<details class="rd-think"><summary>💭 思考过程</summary><div class="rd-think-body">' + escHtml(think) + '</div></details>';
        }
        if (m.content) html += mdRender(String(m.content));
      });
      if (!html.trim()) html = '<div class="rd-think-body">（此条无正文，仅思考或工具调用）</div>';
      wrap.innerHTML = html;
      decorateCode(wrap);
      rdMessages.appendChild(wrap);
    });
    // 默认定位到最新消息（与桌面会话详情一致）
    rdMessages.scrollTop = rdMessages.scrollHeight;
  }

  // 工作日志 → 全屏文档阅读器（复用 /api/notes/file，与笔记页同一读取通道）
  function openHomeDoc(f) {
    var proj = null;
    (cachedProjects || []).forEach(function (p) { if (Number(p.id) === Number(f.projectId)) proj = p; });
    if (!proj || !proj.dir) { toast('找不到该笔记所属项目，请先进入一次笔记页'); return; }
    docTitle.textContent = String(f.rel || '').split(/[\\/]/).pop() || '文档';
    docBody.innerHTML = '';
    docBody.appendChild(emptyNode('加载中…'));
    docReader.classList.add('show');
    request('/api/notes/file?dir=' + encodeURIComponent(String(proj.dir)) + '&path=' + encodeURIComponent(String(f.rel || '')))
      .then(function (data) {
        docBody.innerHTML = '';
        if (!data || !data.ok) { docBody.appendChild(emptyNode((data && data.error) || '读取失败')); return; }
        var ext = String(data.ext || '').toLowerCase();
        if (ext === '.md' || ext === '.markdown') {
          docBody.innerHTML = mdRender(String(data.content || ''));
          decorateCode(docBody);
        } else {
          var pre = document.createElement('pre');
          pre.style.cssText = 'white-space:pre-wrap;font-size:13px;line-height:1.6;';
          pre.textContent = String(data.content || '');
          docBody.appendChild(pre);
        }
      })
      .catch(function (e) {
        docBody.innerHTML = '';
        docBody.appendChild(emptyNode(e.message || '读取失败'));
      });
  }
  function closeHomeDoc() {
    docReader.classList.remove('show');
    docBody.innerHTML = '';
  }

  // 待办详情弹层：点击行看全文与来源，点「标记完成」才真正完成
  var todoSheet = document.getElementById('todoSheet');
  var todoSheetText = document.getElementById('todoSheetText');
  var todoSheetMeta = document.getElementById('todoSheetMeta');
  var todoSheetOk = document.getElementById('todoSheetOk');
  var todoSheetCancel = document.getElementById('todoSheetCancel');
  var todoSheetOpen = document.getElementById('todoSheetOpen');
  var todoSheetItem = null;
  function openTodoSheet(kind, t) {
    todoSheetItem = { kind: kind, t: t };
    todoSheetText.textContent = kind === 'local' ? String(t.title || '') : String(t.text || '');
    if (kind === 'local') {
      todoSheetMeta.textContent = (t.due_date ? '截止 ' + t.due_date + ' · ' : '') + '本地待办';
      todoSheetOpen.hidden = true;
      todoSheetOk.textContent = '标记完成';
    } else {
      todoSheetMeta.textContent = '来自笔记：' + (String(t.file || '').split(/[\\/]/).pop() || '') + (t.line ? '（第 ' + t.line + ' 行）' : '');
      todoSheetOpen.hidden = false;
      todoSheetOk.textContent = '勾选完成（回写笔记）';
    }
    todoSheet.classList.add('show');
  }
  function closeTodoSheet() {
    todoSheet.classList.remove('show');
    todoSheetItem = null;
  }
  todoSheetCancel.addEventListener('click', closeTodoSheet);
  todoSheet.addEventListener('click', function (e) { if (e.target === todoSheet) closeTodoSheet(); });
  todoSheetOpen.addEventListener('click', function () {
    if (!todoSheetItem || todoSheetItem.kind !== 'digest') return;
    var t = todoSheetItem.t;
    closeTodoSheet();
    openHomeDoc({ projectId: t.project_id, rel: t.file, projectName: '' });
  });
  todoSheetOk.addEventListener('click', function () {
    if (!todoSheetItem) return;
    var kind = todoSheetItem.kind;
    var t = todoSheetItem.t;
    closeTodoSheet();
    if (kind === 'local') toggleHomeTodo(t);
    else toggleHomeDigestTodo(t);
  });

  // 待办勾选：本地待办改库，笔记提炼待办回写笔记复选框；成功后刷新首页数据
  function toggleHomeTodo(t) {
    var done = String(t.status) !== 'done';
    postJson('/api/todos/toggle', { kind: 'local', id: t.id, done: done })
      .then(function (r) {
        if (!r || !r.ok) { toast(r && r.error || '操作失败'); return; }
        toast(done ? '已完成' : '已恢复未完成');
        loadToday();
      })
      .catch(function (e) { toast(e.message || '操作失败'); });
  }
  function toggleHomeDigestTodo(t) {
    var done = !t.done;
    postJson('/api/todos/toggle', {
      kind: 'digest',
      projectId: t.project_id,
      file: t.file,
      line: t.line,
      text: t.text,
      done: done
    }).then(function (r) {
      if (!r || !r.ok) { toast(r && r.error || '回写笔记失败'); return; }
      toast(done ? '已勾选，笔记已同步' : '已恢复，笔记已同步');
      loadToday();
    }).catch(function (e) { toast(e.message || '操作失败'); });
  }

  rdBackBtn.addEventListener('click', backFromRd);
  rdBackBtnFloat.addEventListener('click', backFromRd);
  docCloseBtn.addEventListener('click', closeHomeDoc);
  // 会话详情 / 文档阅读器的代码块复制（与对话页同款交互）
  [rdMessages, docBody].forEach(function (el) {
    el.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.copy-btn') : null;
      if (!btn) return;
      var pre = btn.parentNode;
      var code = pre.querySelector('code');
      copyText(((code || pre).innerText || '').replace(/\n$/, ''), function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制'; }, 1200);
      });
    });
  });

  // ---------- 问雷达 ----------
  // 基于已采集的 AI 工具会话检索问答：POST /api/radar/ask（一次性 AI 调用，服务端 120s 硬超时）。
  // 空态显示示例问题卡片，点击直接提问；回答 markdown 渲染，来源列表展示命中会话。
  var radarAsking = false;
  var RADAR_EXAMPLES = [
    { icon: '🔧', text: 'Claude Code 最近帮我修了哪些 bug？' },
    { icon: '💬', text: '本周我在 Qoder 里讨论过什么？' },
    { icon: '📦', text: '支付模块最近做过哪些改动？' }
  ];

  function renderRadarExamples() {
    radarExamples.innerHTML = '';
    RADAR_EXAMPLES.forEach(function (ex) {
      var b = document.createElement('button');
      b.className = 'radar-ex';
      b.type = 'button';
      b.innerHTML = '<b>' + ex.icon + '</b>' + escHtml(ex.text);
      b.addEventListener('click', function () {
        radarInput.value = ex.text;
        updateRadarSend();
        askRadarFlow();
      });
      radarExamples.appendChild(b);
    });
  }

  function updateRadarSend() {
    radarAskBtn.disabled = radarAsking || !radarInput.value.trim();
  }
  radarAskBtn.addEventListener('click', askRadarFlow);
  radarInput.addEventListener('input', updateRadarSend);
  radarInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!radarAskBtn.disabled) askRadarFlow();
    }
  });

  function setRadarStatus(html, isErr) {
    radarStatus.innerHTML = html || '';
    radarStatus.classList.toggle('err', !!isErr);
  }

  function updateRadarModelChip() {
    var label = modelLabel(state.radarModel);
    radarModelBtn.textContent = (label.length > 14 ? label.slice(0, 14) + '…' : label) + ' ▾';
  }
  radarModelBtn.addEventListener('click', function () { openModelSheet('radar'); });
  updateRadarModelChip();

  function enterRadar() {
    show(radarView);
    if (!radarExamples.children.length) renderRadarExamples();
    updateRadarSend();
  }

  function askRadarFlow() {
    var q = radarInput.value.trim();
    if (!q || radarAsking) return;
    radarAsking = true;
    updateRadarSend();
    setRadarStatus('<span class="radar-spin"></span>正在检索已采集对话并汇总…');
    postJson('/api/radar/ask', { question: q, model: state.radarModel || undefined })
      .then(function (data) {
        radarAsking = false;
        updateRadarSend();
        setRadarStatus('');
        radarAnswerWrap.classList.remove('hidden');
        if (!data.ok) {
          radarAnswerBody.textContent = data.error || '提问失败';
          radarRefs.classList.add('hidden');
          return;
        }
        radarAnswerBody.innerHTML = mdRender(String(data.answer || ''));
        decorateCode(radarAnswerBody);
        var refs = data.refs || [];
        if (refs.length) {
          radarRefs.classList.remove('hidden');
          radarRefs.innerHTML = '';
          refs.forEach(function (r) {
            var row = document.createElement('div');
            row.className = 'radar-ref';
            row.innerHTML = '<span class="rf-tool">' + escHtml(r.tool || '') + '</span>'
              + '<span class="rf-title">' + escHtml(r.title || '（无标题会话）') + '</span>';
            radarRefs.appendChild(row);
          });
        } else {
          radarRefs.classList.add('hidden');
        }
        radarAnswerWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
      .catch(function (e) {
        radarAsking = false;
        updateRadarSend();
        setRadarStatus(e.message || '提问失败', true);
      });
  }

  // 回答区代码块复制（与对话页同款交互）
  radarAnswerBody.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.copy-btn') : null;
    if (!btn) return;
    var pre = btn.parentNode;
    var code = pre.querySelector('code');
    copyText(((code || pre).innerText || '').replace(/\n$/, ''), function () {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1200);
    });
  });

  // ---------- 笔记库 ----------
  // 左侧树面板：文件夹点按原地展开（懒加载子层），文件点开 → 全屏阅读器，树收起到左侧；
  // 阅读栏 ☰ 或左侧把手唤回树面板（不关闭文件）。
  // 搜索从项目根目录全文检索（与桌面端一致），结果带相对路径，直接可点开。
  var notes = {
    projects: [],
    dir: '',        // 当前笔记项目目录（绝对路径，来自 /api/projects）
    projName: '笔记库',  // 当前笔记项目名（顶部标题）
    searchTimer: null,
    readerOpen: false
  };

  // 树面板收至左侧 / 唤回（阅读器是否打开不受影响）
  function setPaneHidden(hidden) {
    notesPane.classList.toggle('collapsed', hidden);
    notesHandle.classList.toggle('show', hidden);
  }

  function toggleNotesPane() {
    setPaneHidden(!notesPane.classList.contains('collapsed'));
  }

  function enterNotes() {
    show(notesView);
    pushScreen('notes');
    notesTitle.textContent = notes.projName;
    setPaneHidden(false);
    if (notes.readerOpen) closeNoteReader();
    notesQuery.value = '';
    notesList.innerHTML = '';
    notesList.appendChild(emptyNode('加载中…'));
    loadNotesProjects();
  }

  // 关闭阅读器：文件留白、笔记树回到视野
  function closeNoteReader() {
    notes.readerOpen = false;
    notesReader.classList.remove('show');
    readerBody.innerHTML = '';
    setPaneHidden(false);
    notesTitle.textContent = notes.projName;
    readerTitle.textContent = '笔记';
  }

  function resetNotes() {
    notes.readerOpen = false;
    notesQuery.value = '';
    notesReader.classList.remove('show');
    readerBody.innerHTML = '';
    readerTitle.textContent = '笔记';
  }

  function loadNotesProjects() {
    request('/api/projects').then(function (data) {
      notes.projects = data.projects || [];
      renderNotesProjects();
    }).catch(function () {
      notesList.innerHTML = '';
      notesList.appendChild(emptyNode('加载笔记项目失败'));
    });
  }

  function emptyNode(text) {
    var d = document.createElement('div');
    d.className = 'empty';
    text.split('\n').forEach(function (line, i) {
      if (i) d.appendChild(document.createElement('br'));
      d.appendChild(document.createTextNode(line));
    });
    return d;
  }

  function renderNotesProjects() {
    notesProjBar.innerHTML = '';
    notesTitle.textContent = notes.projName;
    if (notes.readerOpen) closeNoteReader();
    if (!notes.projects.length) {
      notes.dir = '';
      resetNotes();
      notesList.innerHTML = '';
      notesList.appendChild(emptyNode('还没有笔记项目\n先在桌面端添加一个笔记项目'));
      return;
    }
    notes.projects.forEach(function (p, i) {
      var chip = document.createElement('button');
      chip.className = 'notes-chip' + (i === 0 ? ' active' : '');
      chip.type = 'button';
      chip.textContent = p.name;
      chip.addEventListener('click', function () { selectNotesProject(i); });
      notesProjBar.appendChild(chip);
    });
    selectNotesProject(0);
  }

  function selectNotesProject(index) {
    var p = notes.projects[index];
    if (!p) return;
    var chips = notesProjBar.children;
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('active', i === index);
    notes.projName = p.name || notes.projName;
    notesTitle.textContent = notes.projName;
    if (notes.readerOpen) closeNoteReader();
    if (!p.dir) {
      notes.dir = '';
      resetNotes();
      notesList.innerHTML = '';
      notesList.appendChild(emptyNode('该项目没有可用目录'));
      return;
    }
    notes.dir = p.dir;
    resetNotes();
    loadTreeRoot(notes.dir, notesList);
  }

  function loadTreeRoot(dir, host) {
    host.innerHTML = '';
    host.appendChild(notesHeader(dir));
    host.appendChild(emptyNode('加载中…'));
    request('/api/notes/tree?dir=' + encodeURIComponent(dir)).then(function (data) {
      host.innerHTML = '';
      host.appendChild(notesHeader(dir));
      if (!data.entries.length) {
        host.appendChild(emptyNode('这个目录是空的'));
        return;
      }
      buildTree(host, notes.dir, '', data.entries, 0);
    }).catch(function (e) {
      host.innerHTML = '';
      host.appendChild(notesHeader(dir));
      host.appendChild(emptyNode(e.message || '读取目录失败'));
    });
  }

  function notesHeader(dir) {
    // 顶部信息行：当前笔记项目名 + 目录绝对路径（只展示，不再承担目录回退）
    var h = document.createElement('div');
    h.className = 'notes-row info-row';
    var icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = '🗂️';
    var t = document.createElement('span');
    t.className = 'name';
    t.textContent = notes.projName || '笔记库';
    var sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = dir || '（未选择目录）';
    h.appendChild(icon);
    h.appendChild(t);
    h.appendChild(sub);
    return h;
  }

  // 目录树：文件夹懒加载子层，点按原地展开/收起；文件点开 → 全屏阅读器。
  // rel 为相对项目根目录的路径；dirBase 为当前层实际目录（接口参数）。
  function buildTree(host, dirBase, relBase, entries, depth) {
    sortEntries(entries);
    entries.forEach(function (e) {
      var rel = relBase ? relBase + '/' + e.name : e.name;
      var node = entryNode(e, rel, dirBase, depth);
      host.appendChild(node.row);
      if (node.wrap) host.appendChild(node.wrap);
    });
  }

  function sortEntries(entries) {
    entries.sort(function (a, b) {
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
  }

  function fileNode(e, relPath, parentDir, depth) {
    var row = document.createElement('div');
    row.className = 'notes-row sub-row';
    row.style.paddingLeft = (12 + depth * 14) + 'px';
    var icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = '📄';
    var name = document.createElement('span');
    name.className = 'name';
    name.appendChild(document.createTextNode(e.name));
    var extMatch = e.name.match(/\.[a-z0-9]+$/i);
    if (extMatch) {
      var ext = extMatch[0].toLowerCase();
      // 文件名已带该扩展名时再贴一个 txt 标签反而重复（随手记.txt.txt），仅对无扩展名的补类型标签
      var nameLower = e.name.toLowerCase();
      if (nameLower.slice(-ext.length) !== ext) {
        var extBadge = document.createElement('span');
        extBadge.className = 'ext';
        extBadge.textContent = ext.replace('.', '');
        name.appendChild(extBadge);
      }
    }
    row.appendChild(icon);
    row.appendChild(name);
    row.addEventListener('click', function () {
      openNoteReader(relPath, parentDir, e.name);
    });
    return { row: row, wrap: null };
  }

  function entryNode(e, relPath, parentDir, depth) {
    if (e.type !== 'folder') return fileNode(e, relPath, notes.dir, depth);
    var row = document.createElement('div');
    row.className = 'notes-row sub-row';
    row.style.paddingLeft = (12 + depth * 14) + 'px';
    var arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '▸';
    var icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = '📁';
    var name = document.createElement('span');
    name.className = 'name';
    name.appendChild(document.createTextNode(e.name));
    var count = document.createElement('span');
    count.className = 'count';
    row.appendChild(arrow);
    row.appendChild(icon);
    row.appendChild(name);
    row.appendChild(count);

    // 子层容器：收起时 display:none 但内容保留（再展开秒开，懒加载只会请求一次）
    var wrap = document.createElement('div');
    wrap.className = 'notes-children';
    var loaded = false;

    function expand() {
      arrow.classList.add('open');
      wrap.classList.add('open');
      if (loaded) return;
      loaded = true;
      wrap.appendChild(emptyNode('加载中…'));
      request('/api/notes/tree?dir=' + encodeURIComponent(parentDir + '/' + e.name))
        .then(function (data) {
          wrap.innerHTML = '';
          count.textContent = data.entries.length + ' 项';
          if (!data.entries.length) {
            wrap.appendChild(emptyNode('（空文件夹）'));
            return;
          }
          buildTree(wrap, parentDir + '/' + e.name, relPath, data.entries, depth + 1);
        })
        .catch(function (err) {
          loaded = false;
          wrap.innerHTML = '';
          wrap.appendChild(emptyNode(err.message || '读取子目录失败'));
        });
    }

    function collapse() {
      arrow.classList.remove('open');
      wrap.classList.remove('open');
    }

    row.addEventListener('click', function () {
      if (wrap.classList.contains('open')) {
        collapse();
      } else {
        expand();
      }
    });
    return { row: row, wrap: wrap };
  }

  function openNoteReader(relPath, baseDir, name) {
    // relPath 相对 baseDir；接口 dir 传 baseDir。打开后阅读器全屏、笔记树收起到左侧
    var dir = baseDir || notes.dir;
    notes.readerOpen = true;
    notesTitle.textContent = name || '笔记';
    readerTitle.textContent = name || '笔记';
    readerBody.innerHTML = '';
    readerBody.appendChild(emptyNode('加载中…'));
    notesReader.classList.add('show');
    setPaneHidden(true);
    request('/api/notes/file?dir=' + encodeURIComponent(dir) + '&path=' + encodeURIComponent(relPath))
      .then(function (data) {
        readerBody.innerHTML = '';
        readerTitle.textContent = data.name || name || '未命名';
        var body;
        if (data && (data.ext === '.md' || data.ext === '.markdown')) {
          body = document.createElement('div');
          body.className = 'content md';
          body.innerHTML = mdRender(data.content);
          decorateCode(body);
        } else {
          // 非 md：等宽纯文本整体展示，保留换行
          body = document.createElement('div');
          body.className = 'reader-plain';
          body.textContent = data.content;
          var copy = document.createElement('button');
          copy.className = 'copy-btn';
          copy.type = 'button';
          copy.textContent = '复制全文';
          body.appendChild(copy);
        }
        readerBody.appendChild(body);
        readerBody.scrollTop = 0;
      }).catch(function (e) {
        notes.readerOpen = false;
        readerBody.innerHTML = '';
        readerBody.appendChild(emptyNode(e.message || '读取文件失败'));
      });
  }

  function clearSearch() {
    notesQuery.value = '';
    loadTreeRoot(notes.dir, notesList);
  }

  function onNotesSearch() {
    if (notes.searchTimer) clearTimeout(notes.searchTimer);
    notes.searchTimer = setTimeout(doNotesSearch, 320);
  }

  function doNotesSearch() {
    var q = notesQuery.value.trim();
    // 搜索只针对项目根目录：与桌面端 ⌘K 一致，不随目录树展开收窄
    var rootDir = notes.dir;
    if (!rootDir) return;
    if (notes.readerOpen) closeNoteReader();
    if (!q) {
      clearSearch();
      return;
    }
    request('/api/notes/search?dir=' + encodeURIComponent(rootDir) + '&q=' + encodeURIComponent(q)).then(function (data) {
      notesList.innerHTML = '';
      var h = document.createElement('div');
      h.className = 'notes-row info-row';
      var t = document.createElement('span');
      t.className = 'name';
      t.textContent = '搜索结果';
      var count = document.createElement('span');
      count.className = 'sub';
      count.textContent = '关键词「' + q + '」命中 ' + (data.results || []).length + ' 条';
      h.appendChild(t);
      h.appendChild(count);
      notesList.appendChild(h);
      if (!data.results.length) {
        notesList.appendChild(emptyNode('没有匹配的笔记\n换个关键词试试'));
        return;
      }
      data.results.forEach(function (r) {
        // r.path 相对项目根目录；阅读器 dir 传根目录
        var node = fileNode({ name: r.name, type: 'file' }, r.path, rootDir, 0);
        notesList.appendChild(node.row);
      });
    }).catch(function (e) {
      notesList.innerHTML = '';
      notesList.appendChild(emptyNode(e.message || '搜索失败'));
    });
  }

  function backNotes() {
    // 阅读器打开中 → 先退出阅读器（笔记树回到视野）
    if (notesReader.classList.contains('show')) {
      closeNoteReader();
      return;
    }
    backToList();
  }

  // 阅读器内复制（decorateCode 的 pre 复制 + 纯文本复制共用一个入口）
  notesReader.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.copy-btn') : null;
    if (!btn) return;
    var host = btn.parentNode;
    if (host && host.classList && host.classList.contains('reader-plain')) {
      copyText(host.innerText || '', function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制全文'; }, 1200);
      });
      return;
    }
    var pre = host;
    var code = pre.querySelector ? pre.querySelector('code') : null;
    copyText(((code || pre).innerText || '').replace(/\n$/, ''), function () {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1200);
    });
  });

  tabHome.addEventListener('click', enterHome);
  tabNotes.addEventListener('click', enterNotes);
  tabRadar.addEventListener('click', enterRadar);
  tabList.addEventListener('click', backToList);
  notesBackBtn.addEventListener('click', backNotes);
  notesBackBtnFloat.addEventListener('click', backNotes);
  notesQuery.addEventListener('input', onNotesSearch);
  readerCloseBtn.addEventListener('click', function () { closeNoteReader(); });
  readerToggleBtn.addEventListener('click', toggleNotesPane);
  notesHandle.addEventListener('click', toggleNotesPane);

  // ---------- 启动 ----------
  document.getElementById('nameInput').value = state.name || '';
  if (state.token) {
    enterApp();
  } else {
    show(pairView);
  }
})();
</script>
</body>
</html>
