<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>启航AI工作台</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --tab-h: 56px; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f3f4f6;
    color: #111827;
    overflow: hidden;
  }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }
  .hidden { display: none !important; }

  /* 配对页 */
  #pairView { align-items: center; justify-content: center; padding: 24px; background: linear-gradient(160deg, #0f172a, #1e293b); color: #e5e7eb; }
  .pair-box { width: 100%; max-width: 360px; }
  .pair-box h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  .pair-box p { font-size: 13px; color: #94a3b8; margin: 0 0 22px; line-height: 1.6; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 44px; border-radius: 10px; border: 1px solid #334155;
    background: #0b1220; color: #e5e7eb; padding: 0 12px; font-size: 15px; outline: none;
  }
  .field input:focus { border-color: #38bdf8; }
  #codeInput { letter-spacing: 6px; font-size: 20px; text-align: center; }
  .btn {
    height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600;
    background: #2563eb; color: #fff; width: 100%;
  }
  .btn:disabled { opacity: .5; }
  .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
  .pair-error { min-height: 20px; color: #f87171; font-size: 13px; margin-top: 10px; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: #0f172a; color: #fff; flex-shrink: 0;
  }
  .topbar .title { font-size: 16px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 模型切换入口：放输入区上方（Android 内嵌模式会屏蔽顶栏） */
  .model-bar { display: flex; padding: 4px 12px 0; background: #fff; flex-shrink: 0; }
  .model-chip {
    display: inline-flex; align-items: center; max-width: 60%;
    background: #f1f5f9; color: #475569; border: 0; border-radius: 12px;
    font-size: 11.5px; padding: 5px 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .model-chip:active { background: #e2e8f0; }
  .icon-btn {
    background: transparent; border: 0; color: #fff; font-size: 18px; padding: 6px 8px; border-radius: 8px;
  }
  .add-btn { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font-size: 13px; }

  /* 右下角悬浮「新对话」按钮（挂在 app 里时顶栏隐藏，靠它新建对话）；底部导航常驻，故上移让位 */
  .fab {
    position: fixed; right: 18px; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom));
    width: 54px; height: 54px; border-radius: 50%; border: 0;
    background: #2563eb; color: #fff; font-size: 28px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(37, 99, 235, .45); z-index: 30;
  }
  .fab:active { transform: scale(.94); }

  /* 底部常驻导航（对话 / 笔记）：顶栏在 Android app 内嵌模式会隐藏，导航放底部保证可达 */
  .tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    display: flex; background: #fff; border-top: 1px solid #e5e7eb;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    height: var(--tab-h); justify-content: center;
    border: 0; background: transparent; color: #9ca3af; font-size: 11px; font-family: inherit;
  }
  .tab-item .tab-ico { font-size: 20px; line-height: 1; }
  .tab-item.active { color: #2563eb; font-weight: 600; }
  .tab-item:active { background: #f8fafc; }

  /* Android app 内嵌模式（?app=1）：app 自带顶栏，H5 隐藏黑栏，返回改为悬浮钮 */
  body.app-mode .topbar { display: none; }
  body.app-mode #messages { padding-top: 58px; }
  body.app-mode .nc-body { padding-top: 70px; }
  .float-back {
    display: none;
    position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px;
    width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: rgba(15, 23, 42, .55); color: #fff; font-size: 20px;
    align-items: center; justify-content: center; z-index: 30;
  }
  body.app-mode #chatView.active .float-back,
  body.app-mode #composeView.active .float-back,
  body.app-mode #notesView.active .float-back { display: flex; }

  /* 会话列表 */
  #listView { position: relative; }
  #sessionList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 8px); }
  /* 下拉刷新指示器：藏在顶栏下方，下拉时被拉出来 */
  #ptrIndicator {
    position: absolute; top: 0; left: 0; right: 0; height: 44px; margin-top: -44px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    color: #64748b; font-size: 12px; z-index: 5; pointer-events: none;
    transition: transform .25s;
  }
  .ptr-spinner {
    display: none; width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid #cbd5e1; border-top-color: #2563eb;
    animation: ptr-spin .8s linear infinite;
  }
  #ptrIndicator.refreshing .ptr-spinner { display: block; }
  @keyframes ptr-spin { to { transform: rotate(360deg); } }
  .load-more { padding: 14px 0 18px; text-align: center; color: #9ca3af; font-size: 12px; }
  .session .row1 { display: flex; align-items: center; gap: 6px; }
  .session .name { font-size: 15px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .time { font-size: 11px; color: #9ca3af; flex-shrink: 0; }
  .session .preview { font-size: 12px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .session .meta .preview { flex: 1; min-width: 0; }
  .session .proj {
    font-size: 11px; color: #6b7280; background: #f3f4f6; border-radius: 6px;
    padding: 1px 6px; flex-shrink: 0; max-width: 46%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session .tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: #eff6ff; color: #2563eb; flex-shrink: 0; }
  .session .tag.mobile { background: #ecfdf5; color: #059669; }
  .empty { padding: 48px 24px; text-align: center; color: #9ca3af; font-size: 13px; line-height: 1.8; }

  /* 聊天页 */
  #chatView { background: #f3f4f6; }
  #messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 4px; }
  .msg { display: flex; margin-bottom: 10px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 84%; padding: 9px 12px; border-radius: 12px; font-size: 15px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .msg.system .bubble { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; font-size: 13px; }
  .thinking { margin: 0 0 8px; border-left: 3px solid #cbd5e1; padding-left: 8px; }
  .thinking summary { font-size: 12px; color: #64748b; cursor: pointer; }
  .think-body { font-size: 12px; color: #94a3b8; white-space: pre-wrap; margin-top: 4px; max-height: 180px; overflow-y: auto; }
  .tool-line { font-size: 11px; color: #94a3b8; margin-top: 6px; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: #2563eb; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #statusLine { min-height: 18px; font-size: 12px; color: #64748b; padding: 0 16px 6px; flex-shrink: 0; }
  .composer {
    display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid #e5e7eb; flex-shrink: 0;
  }
  .composer textarea {
    flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px;
    font-size: 15px; line-height: 1.4; max-height: 120px; min-height: 42px; outline: none; font-family: inherit;
  }
  .composer textarea:focus { border-color: #2563eb; }
  .composer .send { width: 62px; height: 42px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; }
  .composer .send:disabled { background: #93c5fd; }
  .img-btn {
    width: 42px; height: 42px; border: 1px solid #d1d5db; border-radius: 10px;
    background: #fff; font-size: 18px; flex-shrink: 0; color: #374151;
  }
  .img-btn:active { background: #f1f5f9; }

  /* 待发送图片缩略条 */
  .pending-strip {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 12px 0;
    padding-left: calc(12px + 50px); background: #fff; border-top: 1px solid #f1f5f9; flex-shrink: 0;
  }
  .pending-strip .pending { position: relative; }
  .pending-strip img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid #e5e7eb; display: block; }
  .pending-strip .rm {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    border: 0; background: #ef4444; color: #fff; font-size: 12px; line-height: 1; padding: 0;
  }

  /* 消息内图片 */
  .msg-images { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .msg-images img { max-width: 140px; max-height: 140px; border-radius: 8px; object-fit: cover; display: block; }

  /* Markdown 消息排版（仅助手消息 content 使用） */
  .content.md p { margin: 0 0 8px; }
  .content.md p:last-child { margin-bottom: 0; }
  .content.md h1, .content.md h2, .content.md h3, .content.md h4 { margin: 10px 0 6px; font-size: 15px; line-height: 1.4; }
  .content.md h1:first-child, .content.md h2:first-child, .content.md h3:first-child { margin-top: 0; }
  .content.md ul, .content.md ol { margin: 0 0 8px; padding-left: 20px; }
  .content.md li { margin: 2px 0; }
  .content.md code {
    background: #f1f5f9; border-radius: 4px; padding: 1px 5px; font-size: 13px;
    font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
  }
  .content.md pre {
    position: relative; background: #0f172a; color: #e2e8f0; border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0; font-size: 12.5px; line-height: 1.5;
    -webkit-overflow-scrolling: touch;
  }
  .content.md pre code { background: transparent; color: inherit; padding: 0; white-space: pre; font-size: inherit; }
  .copy-btn {
    position: absolute; top: 6px; right: 6px; border: 0; background: rgba(255, 255, 255, .16);
    color: #cbd5e1; font-size: 11px; border-radius: 6px; padding: 3px 8px;
  }
  .content.md blockquote { border-left: 3px solid #cbd5e1; margin: 8px 0; padding: 2px 10px; color: #64748b; }
  .content.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
  .content.md th, .content.md td { border: 1px solid #e5e7eb; padding: 5px 9px; }
  .content.md a { color: #2563eb; word-break: break-all; }
  .content.md img { max-width: 100%; border-radius: 8px; }
  .content.md hr { border: 0; border-top: 1px solid #e5e7eb; margin: 10px 0; }

  /* 会话左滑操作：actions 垫底，main 平移露出 */
  .session { position: relative; overflow: hidden; border-bottom: 1px solid #e5e7eb; background: #fff; }
  .session .actions { position: absolute; top: 0; right: 0; bottom: 0; display: flex; z-index: 1; }
  .session .actions button { width: 72px; border: 0; color: #fff; font-size: 13px; padding: 0; }
  .session .actions .rename { background: #2563eb; }
  .session .actions .del { background: #ef4444; }
  .session .session-main {
    position: relative; z-index: 2; display: flex; flex-direction: column; gap: 4px;
    padding: 13px 16px; background: #fff; transition: transform .18s ease;
  }
  .session .session-main.swiping { transition: none; }
  .session:active .session-main { background: #f1f5f9; }

  /* 底部弹层（重命名/删除确认） */
  .sheet-mask {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 50;
    display: none; align-items: flex-end;
  }
  .sheet-mask.show { display: flex; }
  .sheet { width: 100%; background: #fff; border-radius: 16px 16px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 12px; font-size: 15px; }
  .sheet input {
    width: 100%; height: 42px; border: 1px solid #d1d5db; border-radius: 10px;
    padding: 0 12px; font-size: 15px; outline: none; font-family: inherit;
  }
  .sheet input:focus { border-color: #2563eb; }
  .sheet .row { display: flex; gap: 10px; margin-top: 14px; }
  .sheet .row button { flex: 1; height: 42px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600; }
  .sheet .btn-cancel { background: #f1f5f9; color: #334155; }
  .sheet .btn-ok { background: #2563eb; color: #fff; }
  .sheet .btn-ok.danger { background: #ef4444; }

  .model-list { max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .model-item {
    display: flex; align-items: center; gap: 8px; padding: 12px 8px;
    border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #111827;
  }
  .model-item:last-child { border-bottom: 0; }
  .model-item:active { background: #f1f5f9; }
  .model-item .mi-sub { font-size: 11px; color: #94a3b8; }
  .model-item .check { margin-left: auto; color: #2563eb; font-weight: 700; visibility: hidden; }
  .model-item.current .check { visibility: visible; }

  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translateX(-50%); background: rgba(15, 23, 42, .85); color: #fff;
    font-size: 13px; padding: 8px 16px; border-radius: 8px; z-index: 60;
    max-width: 80%; text-align: center;
  }

  /* 新建对话页：参考桌面端 NewChatView 的居中问候 + 卡片式输入框 */
  #composeView { background: #f8fafc; }
  .nc-body {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto;
  }
  .nc-hero { text-align: center; margin-bottom: 22px; }
  .nc-mark { font-size: 54px; line-height: 1; opacity: 0.18; }
  .nc-greet { margin: 10px 0 0; font-size: 20px; font-weight: 500; color: #111827; letter-spacing: .01em; }
  .nc-card {
    width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, .06); display: flex; flex-direction: column;
  }
  .nc-card:focus-within { border-color: #2563eb; }
  .nc-top { padding: 10px 12px 0; display: flex; align-items: center; gap: 4px; }
  .nc-pick-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #6b7280; }
  .nc-pick {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 12.5px; font-weight: 500; color: #6b7280;
    outline: none; max-width: 240px; cursor: pointer;
  }
  .nc-pick:focus { color: #111827; }
  .nc-textarea {
    width: 100%; border: 0; outline: none; resize: none; background: transparent;
    font: inherit; font-size: 15px; line-height: 1.7; color: #111827;
    padding: 10px 14px 4px; min-height: 84px;
  }
  .nc-textarea::placeholder { color: #9ca3af; }
  .nc-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 10px; }
  .nc-sp { flex: 1; }
  .nc-send {
    width: 36px; height: 36px; border: 0; border-radius: 50%; background: #2563eb; color: #fff;
    font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .nc-send:disabled { opacity: .4; }
  #composeStatus { min-height: 16px; margin-top: 10px; text-align: center; font-size: 12px; color: #64748b; }

  /* 笔记库：左侧树面板（项目条 + 搜索 + 可展开目录树）+ 右侧全屏阅读器。
     打开文件后树面板收起到左侧，露出把手；顶部 ☰ 或把手随时唤回（不关闭文件）。 */
  .notes-main {
    flex: 1; display: flex; position: relative; overflow: hidden; min-height: 0; background: #fff;
  }
  .notes-pane {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
    width: 100%; max-width: 560px;
    display: flex; flex-direction: column; background: #fff; min-height: 0;
    transition: transform .25s ease;
  }
  .notes-pane.collapsed { transform: translateX(-100%); }
  .notes-proj-bar {
    display: flex; gap: 8px; padding: 10px 14px 4px;
    background: #fff; flex-shrink: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .notes-proj-bar::-webkit-scrollbar { display: none; }
  .notes-chip {
    flex-shrink: 0; border: 0; border-radius: 14px; background: #f1f5f9;
    color: #475569; font-size: 13px; padding: 5px 12px; font-family: inherit;
    max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .notes-chip.active { background: #2563eb; color: #fff; }
  .notes-query { padding: 8px 14px 10px; background: #fff; flex-shrink: 0; }
  .notes-query input {
    width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 10px;
    padding: 0 12px; font-size: 14px; outline: none; font-family: inherit; background: #f8fafc;
  }
  .notes-query input:focus { border-color: #2563eb; background: #fff; }
  #notesList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; }
  .notes-row {
    display: flex; align-items: center; gap: 8px; position: relative; user-select: none;
    border-bottom: 1px solid #f1f5f9; background: #fff;
  }
  .notes-row.info-row { padding: 11px 14px; }
  .notes-row.sub-row { padding: 11px 12px 11px 12px; }
  .notes-row:active { background: #f1f5f9; }
  .notes-row .icon { width: 24px; flex-shrink: 0; font-size: 15px; text-align: center; }
  .notes-row .name { font-size: 14.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .notes-row .name .ext { font-size: 11px; color: #9ca3af; margin-left: 4px; }
  .notes-row .sub { font-size: 11px; color: #9ca3af; flex-shrink: 0; }
  .notes-row .arrow { width: 14px; flex-shrink: 0; font-size: 10px; color: #94a3b8; transition: transform .18s ease; display: inline-block; }
  .notes-row .arrow.open { transform: rotate(90deg); }
  .notes-row .count { font-size: 10.5px; color: #9ca3af; flex-shrink: 0; min-width: 40px; text-align: right; }
  .notes-children { display: none; background: #fbfcfe; }
  .notes-children.open { display: block; }

  /* 阅读器：打开文件时占满右侧全屏，顶部为阅读栏（‹ 关闭 | 文件名 | ☰ 唤回树） */
  #notesReader {
    flex: 1 1 auto; overflow: hidden;
    display: flex; flex-direction: column; background: #fff;
  }
  .reader-hdr {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top));
    background: #f8fafc; border-bottom: 1px solid #e5e7eb; flex-shrink: 0;
  }
  .reader-hdr .reader-title {
    flex: 1; font-size: 15px; font-weight: 600; color: #111827;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .reader-hdr .icon-btn { color: #475569; }
  #readerBody {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 14px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px); background: #fff;
  }
  .reader-plain {
    position: relative;
    white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
    font-size: 12.5px; line-height: 1.6; background: #0f172a; color: #e2e8f0;
    padding: 30px 14px 34px; border-radius: 8px; margin: 0 0 8px;
  }
  .reader-plain .copy-btn { position: absolute; top: 6px; right: 6px; }

  /* 树收起时左侧露出的唤回把手 */
  .notes-handle {

<script src="/vendor/marked.umd.js"></script>
<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'qihang_mobile_token';
  var NAME_KEY = 'qihang_mobile_name';

  // Android app 内嵌模式：WebView 默认 UA 带 "; wv" 标记，此时隐藏 H5 顶栏（app 自带顶栏）
  if (/;\s*wv\)/.test(navigator.userAgent)) {
    document.body.classList.add('app-mode');
  }

  var state = {
    token: localStorage.getItem(TOKEN_KEY) || '',
    name: localStorage.getItem(NAME_KEY) || '',
    sessions: [],
    sessionsHasMore: false,
    sessionsLoadingMore: false,
    sessionsRefreshing: false,
    current: '',
    currentModel: '',
    messages: [],
    streaming: false,
    live: null,
    reconnectTimer: null,
    stopped: false
  };

  var pairView = document.getElementById('pairView');
  var listView = document.getElementById('listView');
  var chatView = document.getElementById('chatView');
  var composeView = document.getElementById('composeView');
  var notesView = document.getElementById('notesView');
  var sessionListEl = document.getElementById('sessionList');
  var messagesEl = document.getElementById('messages');
  var statusEl = document.getElementById('statusLine');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('sendBtn');
  var chatTitleEl = document.getElementById('chatTitle');
  var pairErrorEl = document.getElementById('pairError');
  var projectSelect = document.getElementById('projectSelect');
  var modelSelect = document.getElementById('modelSelect');
  var composeView = document.getElementById('composeView');
  var composeInput = document.getElementById('composeInput');
  var composeSendBtn = document.getElementById('composeSendBtn');
  var composeStatus = document.getElementById('composeStatus');
  var ptrIndicator = document.getElementById('ptrIndicator');
  var ptrText = document.getElementById('ptrText');
  var imgBtn = document.getElementById('imgBtn');
  var imgInput = document.getElementById('imgInput');
  var pendingStrip = document.getElementById('pendingStrip');
  var sheetMask = document.getElementById('sheetMask');
  var sheetTitle = document.getElementById('sheetTitle');
  var sheetInput = document.getElementById('sheetInput');
  var sheetOk = document.getElementById('sheetOk');
  var sheetCancel = document.getElementById('sheetCancel');
  var modelBtn = document.getElementById('modelBtn');
  var modelSheet = document.getElementById('modelSheet');
  var modelList = document.getElementById('modelList');
  var modelCancel = document.getElementById('modelCancel');
  var tabBar = document.getElementById('tabBar');
  var tabList = document.getElementById('tabList');
  var tabNotes = document.getElementById('tabNotes');
  var notesBackBtn = document.getElementById('notesBackBtn');
  var notesBackBtnFloat = document.getElementById('notesBackBtnFloat');
  var notesTitle = document.getElementById('notesTitle');
  var notesProjBar = document.getElementById('notesProjBar');
  var notesQuery = document.getElementById('notesQuery');
  var notesList = document.getElementById('notesList');
  var notesReader = document.getElementById('notesReader');
  var notesPane = document.getElementById('notesPane');
  var notesHandle = document.getElementById('notesHandle');
  var readerBody = document.getElementById('readerBody');
  var readerTitle = document.getElementById('readerTitle');
  var readerCloseBtn = document.getElementById('readerCloseBtn');
  var readerToggleBtn = document.getElementById('readerToggleBtn');

  // ---------- Markdown ----------
  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // 精简 sanitizer：去脚本类标签、on* 事件与 javascript:/非图片 data: 协议
  function sanitizeHtml(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var bad = doc.body.querySelectorAll('script,iframe,object,embed,style,link,meta,base,form');
    for (var i = 0; i < bad.length; i++) bad[i].remove();
    var all = doc.body.querySelectorAll('*');
    for (var j = 0; j < all.length; j++) {
      var el = all[j];
      var attrs = [].slice.call(el.attributes);
      for (var k = 0; k < attrs.length; k++) {
        var name = attrs[k].name.toLowerCase();
        var value = String(attrs[k].value || '').trim().toLowerCase();
        if (name.indexOf('on') === 0) { el.removeAttribute(attrs[k].name); continue; }
        if ((name === 'href' || name === 'src') &&
            (value.indexOf('javascript:') === 0 || (value.indexOf('data:') === 0 && value.indexOf('data:image/') !== 0))) {
          el.removeAttribute(attrs[k].name);
        }
      }
    }
    return doc.body.innerHTML;
  }

  function mdRender(text) {
    var html;
    try {
      html = typeof marked !== 'undefined'
        ? marked.parse(String(text), { breaks: true, gfm: true })
        : escHtml(String(text)).replace(/\n/g, '<br>');
    } catch (e) {
      html = escHtml(String(text));
    }
    return sanitizeHtml(html);
  }

  function decorateCode(container) {
    var pres = container.querySelectorAll('pre');
    for (var i = 0; i < pres.length; i++) {
      if (pres[i].querySelector('.copy-btn')) continue;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.type = 'button';
      btn.textContent = '复制';
      pres[i].appendChild(btn);
    }
  }

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { /* 老内核可能失败 */ }
    ta.remove();
  }

  function copyText(text, cb) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(cb, function () { fallbackCopy(text, cb); });
    } else {
      fallbackCopy(text, cb);
    }
  }

  messagesEl.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.copy-btn') : null;
    if (!btn) return;
    var pre = btn.parentNode;
    var code = pre.querySelector('code');
    copyText(((code || pre).innerText || '').replace(/\n$/, ''), function () {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1200);
    });
  });

  function show(view) {
    [pairView, listView, chatView, composeView, notesView].forEach(function (el) { el.classList.remove('active'); });
    view.classList.add('active');
    // 底部导航只在两个主屏（会话列表 / 笔记库）常驻；聊天/新建/配对页隐藏
    var onRoot = (view === listView || view === notesView);
    tabBar.classList.toggle('hidden', !onRoot);
    tabList.classList.toggle('active', view === listView);
    tabNotes.classList.toggle('active', view === notesView);
  }

  // 进入聊天/新建页时压一条浏览器历史：Android app 返回手势/按键触发 webView.goBack()
  // → popstate → 回列表页；已在列表/配对页时无历史可退，由 app 正常退出
  function pushScreen(screen) {
    history.pushState({ screen: screen }, '', location.href);
  }
  window.addEventListener('popstate', function () {
    show(listView);
    loadSessions();
  });
  // 从 bfcache 恢复时 DOM 是导航离开那一刻的冻结快照，可能与当前代码/状态不一致
  // （曾出现笔记 tab 高亮却显示新建对话页的脏快照）；强制重载拿一份一致的新文档。
  // persisted 仅在 bfcache 恢复时为 true，正常重载为 false，不会造成循环重载。
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) location.reload();
  });

  // 页内返回钮：有历史则走 history.back()（保持历史栈一致），否则直接回列表
  function backToList() {
    if (history.state && history.state.screen) history.back();
    else { show(listView); loadSessions(); }
  }

  // ---------- 接口 ----------
  function request(path, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers || {});
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    return fetch(path, Object.assign({}, options, { headers: headers })).then(function (res) {
      if (res.status === 401) {
        logout();
        throw new Error('未配对或凭证已失效');
      }
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ('请求失败 ' + res.status));
        return data;
      });
    });
  }

  function postJson(path, body) {
    return request(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
  }

  function logout() {
    state.token = '';
    localStorage.removeItem(TOKEN_KEY);
    state.stopped = true;
    if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
    show(pairView);
  }

  // ---------- 配对 ----------
  document.getElementById('pairBtn').addEventListener('click', function () {
    var code = document.getElementById('codeInput').value.replace(/[^\d]/g, '');
    var name = document.getElementById('nameInput').value.trim() || '手机';
    if (!/^\d{6}$/.test(code)) {
      pairErrorEl.textContent = '请输入 6 位数字配对码';
      return;
    }
    var btn = document.getElementById('pairBtn');
    btn.disabled = true;
    pairErrorEl.textContent = '';
    fetch('/api/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, name: name })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok || !data.token) throw new Error(data.error || '配对失败');
        state.token = data.token;
        state.name = name;
        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(NAME_KEY, name);
        enterApp();
      });
    }).catch(function (e) {
      pairErrorEl.textContent = e.message || '配对失败';
    }).finally(function () {
      btn.disabled = false;
    });
  });

  // 配对码输入时只保留数字，并清掉上一次的错误提示
  document.getElementById('codeInput').addEventListener('input', function () {
    this.value = this.value.replace(/[^\d]/g, '');
    pairErrorEl.textContent = '';
  });

  function enterApp() {
    state.stopped = false;
    show(listView);
    loadSessions();
    loadProjects();
    connectEvents();
  }

  // ---------- 会话 ----------
  var cachedProjects = [];

  function loadProjects() {
    return request('/api/projects').then(function (data) {
      cachedProjects = data.projects || [];
      renderSessions();
    }).catch(function () {});
  }

  function projectNameOf(session) {
    if (session.projectId === null || session.projectId === undefined) return '';
    var hit = cachedProjects.filter(function (p) { return Number(p.id) === Number(session.projectId); })[0];
    return hit ? hit.name : ('项目 ' + session.projectId);
  }
  var SESSIONS_PAGE_SIZE = 20;

  // 首屏/下拉刷新：重置到第一页
  function loadSessions() {
    state.sessionsRefreshing = true;
    ptrText.textContent = '刷新中…';
    ptrIndicator.classList.add('refreshing');
    return request('/api/sessions?limit=' + SESSIONS_PAGE_SIZE + '&offset=0').then(function (data) {
      state.sessions = data.sessions || [];
      state.sessionsHasMore = !!data.hasMore;
      renderSessions();
    }).catch(function () {}).then(function () {
      state.sessionsRefreshing = false;
      ptrIndicator.classList.remove('refreshing');
      setPull(0);
    });
  }

  // 上拉翻页：从已加载条数处继续取
  function loadMoreSessions() {
    if (state.sessionsLoadingMore || state.sessionsRefreshing || !state.sessionsHasMore) return;
    state.sessionsLoadingMore = true;
    renderSessions();
    request('/api/sessions?limit=' + SESSIONS_PAGE_SIZE + '&offset=' + state.sessions.length).then(function (data) {
      var more = data.sessions || [];
      state.sessions = state.sessions.concat(more);
      state.sessionsHasMore = !!data.hasMore && more.length > 0;
      renderSessions();
    }).catch(function () {}).then(function () {
      state.sessionsLoadingMore = false;
      renderSessions();
    });
  }

  // ---------- 下拉刷新手势 ----------
  var PTR_THRESHOLD = 60;
  var ptr = { startY: 0, pulling: false, dist: 0 };

  function setPull(px) {
    ptrIndicator.style.transition = px > 0 ? 'none' : '';
    ptrIndicator.style.transform = 'translateY(' + px + 'px)';
  }

  sessionListEl.addEventListener('touchstart', function (e) {
    if (sessionListEl.scrollTop <= 0 && !state.sessionsRefreshing) {
      ptr.startY = e.touches[0].clientY;
      ptr.pulling = true;
      ptr.dist = 0;
    }
  }, { passive: true });

  sessionListEl.addEventListener('touchmove', function (e) {
    if (!ptr.pulling) return;
    var d = e.touches[0].clientY - ptr.startY;
    if (d <= 0) {
      ptr.dist = 0;
      setPull(0);
      ptrText.textContent = '下拉刷新';
      return;
    }
    // 阻尼：越拉越费劲，最多 110px
    ptr.dist = Math.min(d * 0.5, 110);
    setPull(ptr.dist);
    ptrText.textContent = ptr.dist >= PTR_THRESHOLD ? '松开刷新' : '下拉刷新';
  }, { passive: true });

  function ptrRelease() {
    if (!ptr.pulling) return;
    ptr.pulling = false;
    if (ptr.dist >= PTR_THRESHOLD) {
      setPull(44);
      loadSessions();
    } else {
      setPull(0);
    }
    ptr.dist = 0;
  }
  sessionListEl.addEventListener('touchend', ptrRelease);
  sessionListEl.addEventListener('touchcancel', ptrRelease);

  // 滚动到底部附近自动加载下一页
  sessionListEl.addEventListener('scroll', function () {
    if (!state.sessionsHasMore || state.sessionsLoadingMore || state.sessionsRefreshing) return;
    if (sessionListEl.scrollTop + sessionListEl.clientHeight >= sessionListEl.scrollHeight - 200) {
      loadMoreSessions();
    }
  });

  function timeLabel(value) {
    if (!value) return '';
    var raw = String(value).replace(' ', 'T');
    var d = new Date(raw);
    if (isNaN(d.getTime())) return String(value).slice(5, 16);
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    var now = new Date();
    if (d.toDateString() === now.toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  var ACTION_W = 144; // 重命名 + 删除两个按钮的宽度
  var openSessionItem = null; // 当前左滑展开的 .session

  function closeOpenSwipe() {
    if (openSessionItem) {
      openSessionItem.querySelector('.session-main').style.transform = '';
      openSessionItem.classList.remove('open');
      openSessionItem = null;
    }
  }

  function attachSwipe(item, main, session) {
    var startX = 0, startY = 0, axis = null, pos = 0;

    main.addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      axis = null;
      pos = item.classList.contains('open') ? -ACTION_W : 0;
    }, { passive: true });

    main.addEventListener('touchmove', function (e) {
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if (axis === null) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        if (axis === 'x') {
          closeOpenSwipe();
          main.classList.add('swiping');
        }
      }
      if (axis !== 'x') return;
      pos = Math.max(-ACTION_W, Math.min(0, (item.classList.contains('open') ? -ACTION_W : 0) + dx));
      main.style.transform = 'translateX(' + pos + 'px)';
    }, { passive: true });

    function finish() {
      if (axis !== 'x') return;
      main.classList.remove('swiping');
      var shouldOpen = pos < -ACTION_W / 2;
      main.style.transform = shouldOpen ? 'translateX(-' + ACTION_W + 'px)' : '';
      item.classList.toggle('open', shouldOpen);
      openSessionItem = shouldOpen ? item : null;
    }
    main.addEventListener('touchend', finish);
    main.addEventListener('touchcancel', finish);

    main.addEventListener('click', function () {
      if (axis === 'x') { axis = null; return; } // 刚完成滑动，不当作点击
      if (item.classList.contains('open')) { closeOpenSwipe(); return; }
      openSession(session.sessionId, session.title, false, session.modelId);
    });
  }

  function renderSessions() {
    sessionListEl.innerHTML = '';
    openSessionItem = null;
    if (!state.sessions.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有对话，点右下角「+」开始。';
      sessionListEl.appendChild(empty);
      return;
    }
    state.sessions.forEach(function (s) {
      var item = document.createElement('div');
      item.className = 'session';

      var actions = document.createElement('div');
      actions.className = 'actions';
      var renameBtn = document.createElement('button');
      renameBtn.className = 'rename';

  // ---------- 图片发送 ----------
  var MAX_PENDING_IMAGES = 4;
  var pendingImages = [];

  imgBtn.addEventListener('click', function () { imgInput.click(); });

  // 有些安卓选图器返回的 file.type 为空：退回按扩展名判断，MIME 兜底 jpeg
  function isImageFile(file) {
    if (file.type && file.type.indexOf('image/') === 0) return true;
    return /\.(png|jpe?g|gif|webp|bmp|heic|heif)$/i.test(file.name || '');
  }

  function handleImageFile(file) {
    if (!file) return;
    if (!isImageFile(file)) { toast('请选择图片文件'); return; }
    if (pendingImages.length >= MAX_PENDING_IMAGES) { toast('一次最多带 ' + MAX_PENDING_IMAGES + ' 张图'); return; }
    compressImage(file, function (img) {
      if (!img || !img.data) { toast('图片处理失败，请换一张试试'); return; }
      pendingImages.push(img);
      renderPending();
      updateSendState();
    });
  }

  imgInput.addEventListener('change', function () {
    var files = [].slice.call(imgInput.files || []);
    imgInput.value = '';
    files.forEach(handleImageFile);
  });

  // 部分内嵌 WebView 不支持 <input type=file> 弹选择器：支持长按粘贴图片（截图/复制的图）
  [inputEl, document.getElementById('messages')].forEach(function (el) {
    el.addEventListener('paste', function (e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      var picked = false;
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
          var f = items[i].getAsFile();
          if (f) { handleImageFile(f); picked = true; }
        }
      }
      if (picked) e.preventDefault();
    });
  });

  // 压到最长边 1600、JPEG 0.85，控制 base64 体积；解码/画布失败时退回原图 base64
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onerror = function () { cb(null); };
    reader.onload = function (e) {
      var dataUrl = String(e.target.result || '');
      if (!dataUrl) { cb(null); return; }
      var img = new Image();
      img.onload = function () {
        try {
          var MAX = 1600;
          var scale = Math.min(1, MAX / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var out = canvas.toDataURL('image/jpeg', 0.85);
          cb({ data: out.split(',')[1] || '', mimeType: 'image/jpeg' });
        } catch (err) {
          // 画布异常（老内核/内存不足）：退回原图，MIME 兜底 jpeg
          cb({ data: dataUrl.split(',')[1] || '', mimeType: file.type || 'image/jpeg' });
        }
      };
      img.onerror = function () {
        cb({ data: dataUrl.split(',')[1] || '', mimeType: file.type || 'image/jpeg' });
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  }

  function renderPending() {
    pendingStrip.innerHTML = '';
    if (!pendingImages.length) {
      pendingStrip.classList.add('hidden');
      return;
    }
    pendingStrip.classList.remove('hidden');
    pendingImages.forEach(function (img, i) {
      var wrap = document.createElement('div');
      wrap.className = 'pending';
      var el = document.createElement('img');
      el.src = 'data:' + img.mimeType + ';base64,' + img.data;
      var rm = document.createElement('button');
      rm.className = 'rm';
      rm.type = 'button';
      rm.textContent = '×';
      rm.addEventListener('click', function () {
        pendingImages.splice(i, 1);
        renderPending();
        updateSendState();
      });
      wrap.appendChild(el);
      wrap.appendChild(rm);
      pendingStrip.appendChild(wrap);
    });
  }

  function sendMessage() {
    var text = inputEl.value.trim();
    var images = pendingImages.map(function (img) { return { data: img.data, mimeType: img.mimeType }; });
    if ((!text && !images.length) || !state.current || state.streaming) return;
    var sid = state.current;
    inputEl.value = '';
    pendingImages = [];
    renderPending();
    resizeInput();
    state.streaming = true;
    updateSendState();
    statusEl.textContent = '等待响应…';
    appendUserMessage(text, images);
    ensureLive();
    postJson('/api/sessions/' + encodeURIComponent(sid) + '/messages', {
      question: text,
      images: images.length ? images : undefined

      .then(function () {

      .catch(function (e) {
        state.streaming = false;
        statusEl.textContent = '';
        updateSendState();
        finalizeLive();
        messagesEl.appendChild(bubbleWrap('system', e.message || '发送失败'));
        scrollBottom();
      });
  }

  // ---------- SSE ----------
  function connectEvents() {
    if (!state.token || state.stopped) return;
    fetch('/api/events', { headers: { 'Authorization': 'Bearer ' + state.token } })
      .then(function (res) {
        if (res.status === 401) { logout(); return null; }
        if (!res.ok || !res.body) throw new Error('事件流不可用');
        // 断线重连后以数据库对账：先把当前会话的历史重拉一遍
        if (state.current) loadMessages();
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';
        function read() {
          return reader.read().then(function (chunk) {
            if (chunk.done) return;
            buffer += decoder.decode(chunk.value, { stream: true });
            var idx;
            while ((idx = buffer.indexOf('\n\n')) >= 0) {
              handleSseChunk(buffer.slice(0, idx));
              buffer = buffer.slice(idx + 2);
            }
            return read();
          });
        }
        return read();
      })
      .catch(function () {})
      .then(function () {
        if (state.stopped || !state.token) return;
        if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
        state.reconnectTimer = setTimeout(connectEvents, 3000);
      });
  }

  function handleSseChunk(chunk) {
    var event = 'message';
    var dataLines = [];
    chunk.split('\n').forEach(function (line) {
      if (line.indexOf(':') === 0) return; // 心跳注释
      if (line.indexOf('event:') === 0) event = line.slice(6).trim();
      else if (line.indexOf('data:') === 0) dataLines.push(line.slice(5).trim());
    });
    if (!dataLines.length) return;
    var payload;
    try { payload = JSON.parse(dataLines.join('\n')); } catch (e) { return; }
    onEvent(event, payload);
  }

  function onEvent(event, data) {
    var sid = String(data && data.sessionId || '');
    if (!sid || sid !== state.current) return;

    if (event === 'chat:delta') {
      appendText(String(data.text || ''));
      statusEl.textContent = '';
    } else if (event === 'chat:thinking') {
      appendThinking(String(data.text || ''));
    } else if (event === 'chat:tool') {
      showTool(data);
    } else if (event === 'chat:status') {
      statusEl.textContent = String(data.text || '');
    } else if (event === 'chat:done') {
      state.streaming = false;
      statusEl.textContent = '';
      finalizeLive();
      updateSendState();
      loadMessages();
      loadSessions();
    } else if (event === 'chat:error') {
      state.streaming = false;
      statusEl.textContent = '';
      finalizeLive();
      updateSendState();
      messagesEl.appendChild(bubbleWrap('system', String(data.text || '回答失败')));
      scrollBottom();
    }
  }

  // ---------- 笔记库 ----------
  // 左侧树面板：文件夹点按原地展开（懒加载子层），文件点开 → 全屏阅读器，树收起到左侧；
  // 阅读栏 ☰ 或左侧把手唤回树面板（不关闭文件）。
  // 搜索从项目根目录全文检索（与桌面端一致），结果带相对路径，直接可点开。
  var notes = {
    projects: [],
    dir: '',        // 当前笔记项目目录（绝对路径，来自 /api/projects）
    projName: '笔记库',  // 当前笔记项目名（顶部标题）
    searchTimer: null,
    readerOpen: false
  };

  // 树面板收至左侧 / 唤回（阅读器是否打开不受影响）
  function setPaneHidden(hidden) {
    notesPane.classList.toggle('collapsed', hidden);
    notesHandle.classList.toggle('show', hidden);
  }

  function toggleNotesPane() {
    setPaneHidden(!notesPane.classList.contains('collapsed'));
  }

  function enterNotes() {
    show(notesView);
    pushScreen('notes');
    notesTitle.textContent = notes.projName;
    setPaneHidden(false);
    if (notes.readerOpen) closeNoteReader();
    notesQuery.value = '';
    notesList.innerHTML = '';
    notesList.appendChild(emptyNode('加载中…'));
    loadNotesProjects();
  }

  // 关闭阅读器：文件留白、笔记树回到视野
  function closeNoteReader() {
    notes.readerOpen = false;
    notesReader.classList.remove('show');
    readerBody.innerHTML = '';
    setPaneHidden(false);
    notesTitle.textContent = notes.projName;
    readerTitle.textContent = '笔记';
  }

  function resetNotes() {
    notes.readerOpen = false;
    notesQuery.value = '';
    notesReader.classList.remove('show');
    readerBody.innerHTML = '';
    readerTitle.textContent = '笔记';
  }

  function loadNotesProjects() {
    request('/api/projects').then(function (data) {
      notes.projects = data.projects || [];
      renderNotesProjects();
    }).catch(function () {
      notesList.innerHTML = '';
      notesList.appendChild(emptyNode('加载笔记项目失败'));
    });
  }

  function emptyNode(text) {
    var d = document.createElement('div');
    d.className = 'empty';
    text.split('\n').forEach(function (line, i) {
      if (i) d.appendChild(document.createElement('br'));
      d.appendChild(document.createTextNode(line));
    });
    return d;
  }

  function renderNotesProjects() {
    notesProjBar.innerHTML = '';
    notesTitle.textContent = notes.projName;
    if (notes.readerOpen) closeNoteReader();
    if (!notes.projects.length) {
      notes.dir = '';
      resetNotes();
      notesList.innerHTML = '';
      notesList.appendChild(emptyNode('还没有笔记项目\n先在桌面端添加一个笔记项目'));
      return;
    }
    notes.projects.forEach(function (p, i) {
      var chip = document.createElement('button');
      chip.className = 'notes-chip' + (i === 0 ? ' active' : '');
      chip.type = 'button';
      chip.textContent = p.name;
      chip.addEventListener('click', function () { selectNotesProject(i); });
      notesProjBar.appendChild(chip);
    });
    selectNotesProject(0);
  }

  function selectNotesProject(index) {
    var p = notes.projects[index];
    if (!p) return;
    var chips = notesProjBar.children;
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('active', i === index);
    notes.projName = p.name || notes.projName;
    notesTitle.textContent = notes.projName;
    if (notes.readerOpen) closeNoteReader();
    if (!p.dir) {
      notes.dir = '';
      resetNotes();
      notesList.innerHTML = '';
      notesList.appendChild(emptyNode('该项目没有可用目录'));
      return;
    }
    notes.dir = p.dir;
    resetNotes();
    loadTreeRoot(notes.dir, notesList);
  }

  function loadTreeRoot(dir, host) {
    host.innerHTML = '';
    host.appendChild(notesHeader(dir));
    host.appendChild(emptyNode('加载中…'));
    request('/api/notes/tree?dir=' + encodeURIComponent(dir)).then(function (data) {
      host.innerHTML = '';
      host.appendChild(notesHeader(dir));
      if (!data.entries.length) {
        host.appendChild(emptyNode('这个目录是空的'));
        return;
      }
      buildTree(host, notes.dir, '', data.entries, 0);
    }).catch(function (e) {
      host.innerHTML = '';
      host.appendChild(notesHeader(dir));
      host.appendChild(emptyNode(e.message || '读取目录失败'));
    });
  }

  function notesHeader(dir) {
    // 顶部信息行：当前笔记项目名 + 目录绝对路径（只展示，不再承担目录回退）
    var h = document.createElement('div');
    h.className = 'notes-row info-row';
    var icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = '🗂️';
    var t = document.createElement('span');
    t.className = 'name';
    t.textContent = notes.projName || '笔记库';
    var sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = dir || '（未选择目录）';
    h.appendChild(icon);
    h.appendChild(t);
    h.appendChild(sub);
    return h;
  }

  // 目录树：文件夹懒加载子层，点按原地展开/收起；文件点开 → 全屏阅读器。
  // rel 为相对项目根目录的路径；dirBase 为当前层实际目录（接口参数）。
  function buildTree(host, dirBase, relBase, entries, depth) {
    sortEntries(entries);
    entries.forEach(function (e) {
      var rel = relBase ? relBase + '/' + e.name : e.name;
      var node = entryNode(e, rel, dirBase, depth);
      host.appendChild(node.row);
      if (node.wrap) host.appendChild(node.wrap);
    });
  }

  function sortEntries(entries) {
    entries.sort(function (a, b) {
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
  }

  function fileNode(e, relPath, parentDir, depth) {
    var row = document.createElement('div');
    row.className = 'notes-row sub-row';
    row.style.paddingLeft = (12 + depth * 14) + 'px';
    var icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = '📄';
    var name = document.createElement('span');
    name.className = 'name';
    name.appendChild(document.createTextNode(e.name));
    var extMatch = e.name.match(/\.[a-z0-9]+$/i);
    if (extMatch) {
      var ext = extMatch[0].toLowerCase();
      // 文件名已带该扩展名时再贴一个 txt 标签反而重复（随手记.txt.txt），仅对无扩展名的补类型标签
      var nameLower = e.name.toLowerCase();
      if (nameLower.slice(-ext.length) !== ext) {
        var extBadge = document.createElement('span');
        extBadge.className = 'ext';
        extBadge.textContent = ext.replace('.', '');
        name.appendChild(extBadge);
      }
    }
    row.appendChild(icon);
    row.appendChild(name);
    row.addEventListener('click', function () {
      openNoteReader(relPath, parentDir, e.name);
    });
    return { row: row, wrap: null };
  }

  function entryNode(e, relPath, parentDir, depth) {
    if (e.type !== 'folder') return fileNode(e, relPath, notes.dir, depth);
    var row = document.createElement('div');
    row.className = 'notes-row sub-row';
    row.style.paddingLeft = (12 + depth * 14) + 'px';
    var arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '▸';
    var icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = '📁';
    var name = document.createElement('span');
    name.className = 'name';
    name.appendChild(document.createTextNode(e.name));
    var count = document.createElement('span');
    count.className = 'count';
    row.appendChild(arrow);
    row.appendChild(icon);
    row.appendChild(name);
    row.appendChild(count);

    // 子层容器：收起时 display:none 但内容保留（再展开秒开，懒加载只会请求一次）
    var wrap = document.createElement('div');
    wrap.className = 'notes-children';
    var loaded = false;

    function expand() {
      arrow.classList.add('open');
      wrap.classList.add('open');
      if (loaded) return;
      loaded = true;
      wrap.appendChild(emptyNode('加载中…'));
      request('/api/notes/tree?dir=' + encodeURIComponent(parentDir + '/' + e.name))
        .then(function (data) {
          wrap.innerHTML = '';
          count.textContent = data.entries.length + ' 项';
          if (!data.entries.length) {
            wrap.appendChild(emptyNode('（空文件夹）'));
            return;
          }
          buildTree(wrap, parentDir + '/' + e.name, relPath, data.entries, depth + 1);
        })
        .catch(function (err) {
          loaded = false;
          wrap.innerHTML = '';
          wrap.appendChild(emptyNode(err.message || '读取子目录失败'));
        });
    }

    function collapse() {
      arrow.classList.remove('open');
      wrap.classList.remove('open');
    }

    row.addEventListener('click', function () {
      if (wrap.classList.contains('open')) {
        collapse();
      } else {
        expand();
      }
    });
    return { row: row, wrap: wrap };
  }

  function openNoteReader(relPath, baseDir, name) {
    // relPath 相对 baseDir；接口 dir 传 baseDir。打开后阅读器全屏、笔记树收起到左侧
    var dir = baseDir || notes.dir;
    notes.readerOpen = true;
    notesTitle.textContent = name || '笔记';
    readerTitle.textContent = name || '笔记';
    readerBody.innerHTML = '';
    readerBody.appendChild(emptyNode('加载中…'));
    notesReader.classList.add('show');
    setPaneHidden(true);
    request('/api/notes/file?dir=' + encodeURIComponent(dir) + '&path=' + encodeURIComponent(relPath))
      .then(function (data) {
        readerBody.innerHTML = '';
        readerTitle.textContent = data.name || name || '未命名';
        var body;
        if (data && (data.ext === '.md' || data.ext === '.markdown')) {
          body = document.createElement('div');
          body.className = 'content md';
          body.innerHTML = mdRender(data.content);
          decorateCode(body);
        } else {
          // 非 md：等宽纯文本整体展示，保留换行
          body = document.createElement('div');
          body.className = 'reader-plain';
          body.textContent = data.content;
          var copy = document.createElement('button');
          copy.className = 'copy-btn';
          copy.type = 'button';
          copy.textContent = '复制全文';
          body.appendChild(copy);
        }
        readerBody.appendChild(body);
        readerBody.scrollTop = 0;
      }).catch(function (e) {
        notes.readerOpen = false;
        readerBody.innerHTML = '';
        readerBody.appendChild(emptyNode(e.message || '读取文件失败'));
      });
  }

  function clearSearch() {
    notesQuery.value = '';
    loadTreeRoot(notes.dir, notesList);
  }

  function onNotesSearch() {
    if (notes.searchTimer) clearTimeout(notes.searchTimer);
    notes.searchTimer = setTimeout(doNotesSearch, 320);
  }

  function doNotesSearch() {
    var q = notesQuery.value.trim();
    // 搜索只针对项目根目录：与桌面端 ⌘K 一致，不随目录树展开收窄
    var rootDir = notes.dir;
    if (!rootDir) return;
    if (notes.readerOpen) closeNoteReader();
    if (!q) {
      clearSearch();
      return;
    }
    request('/api/notes/search?dir=' + encodeURIComponent(rootDir) + '&q=' + encodeURIComponent(q)).then(function (data) {
      notesList.innerHTML = '';
      var h = document.createElement('div');
      h.className = 'notes-row info-row';
      var t = document.createElement('span');
      t.className = 'name';
      t.textContent = '搜索结果';
      var count = document.createElement('span');
      count.className = 'sub';
      count.textContent = '关键词「' + q + '」命中 ' + (data.results || []).length + ' 条';
      h.appendChild(t);
      h.appendChild(count);
      notesList.appendChild(h);
      if (!data.results.length) {
        notesList.appendChild(emptyNode('没有匹配的笔记\n换个关键词试试'));
        return;
      }
      data.results.forEach(function (r) {
        // r.path 相对项目根目录；阅读器 dir 传根目录
        var node = fileNode({ name: r.name, type: 'file' }, r.path, rootDir, 0);
        notesList.appendChild(node.row);
      });
    }).catch(function (e) {
      notesList.innerHTML = '';
      notesList.appendChild(emptyNode(e.message || '搜索失败'));
    });
  }

  function backNotes() {
    // 阅读器打开中 → 先退出阅读器（笔记树回到视野）
    if (notesReader.classList.contains('show')) {
      closeNoteReader();
      return;
    }
    backToList();
  }

  // 阅读器内复制（decorateCode 的 pre 复制 + 纯文本复制共用一个入口）
  notesReader.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.copy-btn') : null;
    if (!btn) return;
    var host = btn.parentNode;
    if (host && host.classList && host.classList.contains('reader-plain')) {
      copyText(host.innerText || '', function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制全文'; }, 1200);
      });
      return;
    }
    var pre = host;
    var code = pre.querySelector ? pre.querySelector('code') : null;
    copyText(((code || pre).innerText || '').replace(/\n$/, ''), function () {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1200);
    });
  });

  tabNotes.addEventListener('click', enterNotes);
  tabList.addEventListener('click', backToList);
  notesBackBtn.addEventListener('click', backNotes);
  notesBackBtnFloat.addEventListener('click', backNotes);
  notesQuery.addEventListener('input', onNotesSearch);
  readerCloseBtn.addEventListener('click', function () { closeNoteReader(); });
  readerToggleBtn.addEventListener('click', toggleNotesPane);
  notesHandle.addEventListener('click', toggleNotesPane);

  // ---------- 启动 ----------
  document.getElementById('nameInput').value = state.name || '';
  if (state.token) {
    enterApp();
  } else {
    show(pairView);
  }
})();
</script>
</body>
