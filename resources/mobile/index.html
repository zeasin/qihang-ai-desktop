<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>启航AI工作台</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --tab-h: 56px; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f3f4f6;
    color: #111827;
    overflow: hidden;
  }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.active { display: flex; }
  .hidden { display: none !important; }

  /* 配对页 */
  #pairView { align-items: center; justify-content: center; padding: 24px; background: linear-gradient(160deg, #0f172a, #1e293b); color: #e5e7eb; }
  .pair-box { width: 100%; max-width: 360px; }
  .pair-box h1 { font-size: 20px; margin: 0 0 6px; font-weight: 600; }
  .pair-box p { font-size: 13px; color: #94a3b8; margin: 0 0 22px; line-height: 1.6; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 44px; border-radius: 10px; border: 1px solid #334155;
    background: #0b1220; color: #e5e7eb; padding: 0 12px; font-size: 15px; outline: none;
  }
  .field input:focus { border-color: #38bdf8; }
  #codeInput { letter-spacing: 6px; font-size: 20px; text-align: center; }
  .btn {
    height: 44px; border: 0; border-radius: 10px; font-size: 15px; font-weight: 600;
    background: #2563eb; color: #fff; width: 100%;
  }
  .btn:disabled { opacity: .5; }
  .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
  .pair-error { min-height: 20px; color: #f87171; font-size: 13px; margin-top: 10px; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: #0f172a; color: #fff; flex-shrink: 0;
  }
  .topbar .title { font-size: 16px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 模型切换入口：放输入区上方（Android 内嵌模式会屏蔽顶栏） */
  .model-bar { display: flex; padding: 4px 12px 0; background: #fff; flex-shrink: 0; }
  .model-chip {
    display: inline-flex; align-items: center; max-width: 60%;
    background: #f1f5f9; color: #475569; border: 0; border-radius: 12px;
    font-size: 11.5px; padding: 5px 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .model-chip:active { background: #e2e8f0; }
  .icon-btn {
    background: transparent; border: 0; color: #fff; font-size: 18px; padding: 6px 8px; border-radius: 8px;
  }
  .add-btn { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font-size: 13px; }

  /* 右下角悬浮「新对话」按钮（挂在 app 里时顶栏隐藏，靠它新建对话）；底部导航常驻，故上移让位 */
  .fab {
    position: fixed; right: 18px; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom));
    width: 54px; height: 54px; border-radius: 50%; border: 0;
    background: #2563eb; color: #fff; font-size: 28px; font-weight: 300;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(37, 99, 235, .45); z-index: 30;
  }
  .fab:active { transform: scale(.94); }

  /* 底部常驻导航（对话 / 笔记）：顶栏在 Android app 内嵌模式会隐藏，导航放底部保证可达 */
  .tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    display: flex; background: #fff; border-top: 1px solid #e5e7eb;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    height: var(--tab-h); justify-content: center;
    border: 0; background: transparent; color: #9ca3af; font-size: 11px; font-family: inherit;
  }
  .tab-item .tab-ico { font-size: 20px; line-height: 1; }
  .tab-item.active { color: #2563eb; font-weight: 600; }
  .tab-item:active { background: #f8fafc; }

  /* 对话 Tab 未读角标 */
  .tab-item { position: relative; }
  .tab-badge {
    position: absolute; top: 7px; left: calc(50% + 6px); z-index: 2;
    min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
    background: #dc2626; color: #fff; font-size: 10px; line-height: 16px;
    font-weight: 600; text-align: center;
  }
  .tab-badge.hidden { display: none; }

  /* 顶部实时通知横幅（回合收口/失败/待审批） */
  .notice-stack {
    position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 60;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .notice {
    pointer-events: auto; display: flex; gap: 10px; align-items: flex-start;
    background: #fff; border-radius: 12px; padding: 10px 12px;
    border-left: 4px solid #2563eb; box-shadow: 0 6px 20px rgba(15, 23, 42, .18);
    animation: noticeIn .2s ease-out; overflow: hidden;
  }
  .notice.ok { border-left-color: #16a34a; }
  .notice.err { border-left-color: #dc2626; }
  .notice.appr { border-left-color: #d97706; }
  .notice .n-ico { font-size: 16px; line-height: 20px; flex-shrink: 0; }
  .notice .n-body { flex: 1; min-width: 0; }
  .notice .n-title { font-size: 13px; font-weight: 600; color: #111827; }
  .notice .n-brief {
    font-size: 12px; color: #6b7280; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .notice .n-close {
    border: 0; background: transparent; color: #9ca3af; font-size: 15px;
    padding: 2px 4px; flex-shrink: 0;
  }
  .notice.out { animation: noticeOut .18s ease-in forwards; }
  @keyframes noticeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes noticeOut { to { opacity: 0; transform: translateY(-8px); } }

  /* 首页（今天页移动版） */
  .home-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px); }
  .home-date { font-size: 12px; color: #9ca3af; margin: 2px 2px 10px; }
  .home-body .sec { margin-bottom: 16px; }
  .sec-t { font-size: 13px; font-weight: 600; color: #374151; margin: 0 2px 8px; display: flex; align-items: center; gap: 6px; }
  .sec-t em { font-style: normal; font-weight: 400; font-size: 11.5px; color: #9ca3af; }
  .home-card { background: #fff; border-radius: 14px; padding: 6px 12px; box-shadow: 0 2px 10px rgba(15, 23, 42, .06); }
  .sec-act { margin-left: auto; color: #2563eb; font-size: 14px; line-height: 1; padding: 2px 4px; }
  .brief-md { font-size: 13.5px; line-height: 1.7; color: #111827; word-break: break-word; padding: 6px 2px; }
  .brief-md h3 { font-size: 13.5px; margin: 10px 0 4px; color: #1d4ed8; }
  .brief-md h3:first-child { margin-top: 2px; }
  .brief-md p { margin: 4px 0; }
  .brief-md ul { margin: 4px 0; padding-left: 18px; }
  .brief-md li { margin: 2px 0; }
  .brief-md code { font-size: 12px; background: #f1f5f9; border-radius: 4px; padding: 1px 5px; }
  .home-row { display: flex; align-items: flex-start; gap: 8px; padding: 9px 0; border-bottom: 1px solid #f3f4f6; }
  .home-row:last-child { border-bottom: 0; }
  .home-row .dot { width: 6px; height: 6px; border-radius: 999px; background: #d1d5db; margin-top: 6px; flex-shrink: 0; }
  .home-row .dot.warn { background: #f59e0b; }
  .home-row .dot.run { background: #16a34a; }
  .home-row .tx { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; color: #111827; word-break: break-word; }
  .home-row .sub { font-size: 11.5px; color: #9ca3af; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .home-row .tm { font-size: 11px; color: #9ca3af; flex-shrink: 0; margin-top: 2px; }
  .home-badge { background: #eff6ff; color: #2563eb; border-radius: 6px; padding: 2px 7px; font-size: 11px; flex-shrink: 0; }
  .home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tool-card { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 2px 10px rgba(15, 23, 42, .06); }
  .tool-card .tc-name { font-size: 13px; font-weight: 600; color: #111827; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-card .tc-num { font-size: 20px; font-weight: 700; color: #2563eb; margin-top: 4px; }
  .tool-card .tc-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .tool-card .tc-run { color: #16a34a; font-size: 11px; font-weight: 600; }
  .home-empty { padding: 14px 0; text-align: center; color: #9ca3af; font-size: 12.5px; }
  .home-empty.tap { cursor: pointer; }
  .home-empty.tap:active { color: #2563eb; }
  .home-row.click { cursor: pointer; }
  .home-row.click:active { background: #f8fafc; }
  .todo-detail-text { font-size: 14px; line-height: 1.6; color: #111827; word-break: break-word; margin-bottom: 8px; }
  .todo-detail-meta { font-size: 12px; color: #9ca3af; margin-bottom: 12px; }

  /* 雷达会话详情（只读） */
  .rd-messages { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 14px 12px calc(20px + env(safe-area-inset-bottom)); }
  .rd-user {
    margin: 10px 0 10px auto; max-width: 85%; width: fit-content;
    background: #0d9488; color: #fff; border-radius: 14px 14px 4px 14px;
    padding: 9px 12px; font-size: 14px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .rd-ai { margin: 12px 0; font-size: 14px; line-height: 1.7; color: #111827; word-break: break-word; }
  .rd-ai code { font-size: 12px; background: #f1f5f9; border-radius: 4px; padding: 1px 5px; }
  .rd-ai pre {
    background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 10px; overflow-x: auto; font-size: 12px; position: relative; max-width: 100%;
  }
  .rd-ai img { max-width: 100%; border-radius: 8px; }
  .rd-think { margin: 6px 0; }
  .rd-think summary { cursor: pointer; font-size: 12px; color: #9ca3af; }
  .rd-think-body { font-size: 12.5px; color: #6b7280; white-space: pre-wrap; background: #f8fafc; border: 1px solid #eef1f5; border-radius: 8px; padding: 8px 10px; margin-top: 6px; }

  /* 全屏文档阅读器（工作日志跳转） */
  .doc-reader { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 50; background: #fff; display: none; flex-direction: column; }
  .doc-reader.show { display: flex; }
  .doc-hdr {
    display: flex; align-items: center; gap: 6px; padding: 12px 14px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: #0f172a; color: #fff; flex-shrink: 0;
  }
  .doc-hdr .icon-btn { color: #fff; font-size: 20px; }
  .doc-title { font-size: 15px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px calc(24px + env(safe-area-inset-bottom)); font-size: 14px; line-height: 1.7; color: #111827; word-break: break-word; }
  .doc-body p { margin: 0 0 10px; }
  .doc-body ul, .doc-body ol { margin: 0 0 10px; padding-left: 20px; }
  .doc-body code { font-size: 12px; background: #f1f5f9; border-radius: 4px; padding: 1px 5px; }
  .doc-body pre { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; position: relative; }
  .doc-body h1, .doc-body h2, .doc-body h3 { font-size: 15px; margin: 10px 0 6px; }

  /* 问雷达页 */
  .radar-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px); }
  .radar-hero { text-align: center; padding: 14px 0 6px; }
  .radar-mark { width: 52px; height: 52px; margin: 0 auto 8px; border-radius: 14px; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .radar-hero-t { font-size: 17px; font-weight: 600; color: #111827; }
  .radar-hero-d { font-size: 12px; color: #9ca3af; margin-top: 3px; }
  .radar-examples { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .radar-ex {
    text-align: left; border: 1px solid #e5e7eb; background: #fff; border-radius: 12px;
    padding: 10px 12px; font-size: 13px; color: #475569; font-family: inherit;
  }
  .radar-ex:active { background: #f1f5f9; }
  .radar-ex b { color: #2563eb; margin-right: 6px; }
  .radar-card { background: #fff; border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(15, 23, 42, .06); }
  .radar-card textarea {
    width: 100%; border: 0; outline: none; resize: none; font-family: inherit;
    font-size: 14px; line-height: 1.5; color: #111827; background: transparent; padding: 0;
  }
  .radar-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .radar-status { flex: 1; font-size: 12px; color: #2563eb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .radar-status.err { color: #dc2626; }
  .radar-spin {
    display: inline-block; width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid #bfdbfe; border-top-color: #2563eb;
    animation: radar-spin .8s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes radar-spin { to { transform: rotate(360deg); } }
  .radar-answer { background: #fff; border-radius: 14px; padding: 14px; margin-top: 14px; box-shadow: 0 2px 10px rgba(15, 23, 42, .06); }
  .radar-answer-title { font-size: 12px; font-weight: 600; color: #9ca3af; margin-bottom: 8px; }
  .radar-answer-body { font-size: 14px; line-height: 1.7; color: #111827; word-break: break-word; }
  .radar-answer-body p { margin: 0 0 10px; }
  .radar-answer-body ul, .radar-answer-body ol { margin: 0 0 10px; padding-left: 20px; }
  .radar-answer-body code { font-size: 12px; background: #f1f5f9; border-radius: 4px; padding: 1px 5px; }
  .radar-answer-body pre { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; position: relative; }
  .radar-answer-body pre .copy-btn { position: absolute; top: 6px; right: 6px; border: 0; background: #e2e8f0; color: #475569; border-radius: 6px; font-size: 11px; padding: 3px 8px; }
  .radar-answer-body h1, .radar-answer-body h2, .radar-answer-body h3 { font-size: 15px; margin: 10px 0 6px; }
  .radar-refs { margin-top: 12px; border-top: 1px solid #f1f5f9; padding-top: 10px; }
  .radar-ref { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12px; color: #6b7280; }
  .radar-ref .rf-tool { background: #eff6ff; color: #2563eb; border-radius: 6px; padding: 2px 7px; font-size: 11px; flex-shrink: 0; }
  .radar-ref .rf-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Android app 内嵌模式（?app=1）：app 自带顶栏，H5 隐藏黑栏，返回改为悬浮钮 */
  body.app-mode .topbar { display: none; }
  body.app-mode #messages { padding-top: 58px; }
  body.app-mode .nc-body { padding-top: 70px; }
  .float-back {
    display: none;
    position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px;
    width: 38px; height: 38px; border-radius: 50%; border: 0;
    background: rgba(15, 23, 42, .55); color: #fff; font-size: 20px;
    align-items: center; justify-content: center; z-index: 30;
  }
  body.app-mode #chatView.active .float-back,
  body.app-mode #composeView.active .float-back,
  body.app-mode #notesView.active .float-back { display: flex; }

  /* 会话列表 */
  #listView { position: relative; }
  #sessionList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 8px); }
  /* 下拉刷新指示器：藏在顶栏下方，下拉时被拉出来 */
  #ptrIndicator {
    position: absolute; top: 0; left: 0; right: 0; height: 44px; margin-top: -44px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    color: #64748b; font-size: 12px; z-index: 5; pointer-events: none;
    transition: transform .25s;
  }
  .ptr-spinner {
    display: none; width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid #cbd5e1; border-top-color: #2563eb;
    animation: ptr-spin .8s linear infinite;
  }
  #ptrIndicator.refreshing .ptr-spinner { display: block; }
  @keyframes ptr-spin { to { transform: rotate(360deg); } }
  .load-more { padding: 14px 0 18px; text-align: center; color: #9ca3af; font-size: 12px; }
  .session .row1 { display: flex; align-items: center; gap: 6px; }
  .session .name { font-size: 15px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .time { font-size: 11px; color: #9ca3af; flex-shrink: 0; }
  .session .preview { font-size: 12px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .session .meta .preview { flex: 1; min-width: 0; }
  .session .proj {
    font-size: 11px; color: #6b7280; background: #f3f4f6; border-radius: 6px;
    padding: 1px 6px; flex-shrink: 0; max-width: 46%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session .tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: #eff6ff; color: #2563eb; flex-shrink: 0; }
  .session .tag.mobile { background: #ecfdf5; color: #059669; }
  .empty { padding: 48px 24px; text-align: center; color: #9ca3af; font-size: 13px; line-height: 1.8; }

  /* 聊天页 */
  #chatView { background: #f3f4f6; }
  #messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 4px; }
  .msg { display: flex; margin-bottom: 10px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 84%; padding: 9px 12px; border-radius: 12px; font-size: 15px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .msg.system .bubble { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; font-size: 13px; }
  .thinking { margin: 0 0 8px; border-left: 3px solid #cbd5e1; padding-left: 8px; }
  .thinking summary { font-size: 12px; color: #64748b; cursor: pointer; }
  .think-body { font-size: 12px; color: #94a3b8; white-space: pre-wrap; margin-top: 4px; max-height: 180px; overflow-y: auto; }
  .tool-line { font-size: 11px; color: #94a3b8; margin-top: 6px; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: #2563eb; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #statusLine { min-height: 18px; font-size: 12px; color: #64748b; padding: 0 16px 6px; flex-shrink: 0; }
  .composer {
    display: flex; gap: 8px; align-items: flex-end; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #fff; border-top: 1px solid #e5e7eb; flex-shrink: 0;
  }
  .composer textarea {
    flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px;
    font-size: 15px; line-height: 1.4; max-height: 120px; min-height: 42px; outline: none; font-family: inherit;
  }
  .composer textarea:focus { border-color: #2563eb; }
  .composer .send { width: 62px; height: 42px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; }
  .composer .send:disabled { background: #93c5fd; }
  .img-btn {
    width: 42px; height: 42px; border: 1px solid #d1d5db; border-radius: 10px;
    background: #fff; font-size: 18px; flex-shrink: 0; color: #374151;
  }
  .img-btn:active { background: #f1f5f9; }

  /* 待发送图片缩略条 */
  .pending-strip {
    display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 12px 0;
    padding-left: calc(12px + 50px); background: #fff; border-top: 1px solid #f1f5f9; flex-shrink: 0;
  }

  .content.md pre {
    position: relative; background: #0f172a; color: #e2e8f0; border-radius: 8px;

  }
  .content.md pre code { background: transparent; color: inherit; padding: 0; white-space: pre; font-size: inherit; }
  .copy-btn {
    position: absolute; top: 6px; right: 6px; border: 0; background: rgba(255, 255, 255, .16);
    color: #cbd5e1; font-size: 11px; border-radius: 6px; padding: 3px 8px;
  }
  .content.md blockquote { border-left: 3px solid #cbd5e1; margin: 8px 0; padding: 2px 10px; color: #64748b; }
  .content.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
  .content.md th, .content.md td { border: 1px solid #e5e7eb; padding: 5px 9px; }
  .content.md a { color: #2563eb; word-break: break-all; }
  .content.md img { max-width: 100%; border-radius: 8px; }
  .content.md hr { border: 0; border-top: 1px solid #e5e7eb; margin: 10px 0; }

  /* 会话左滑操作：actions 垫底，main 平移露出 */
  .session { position: relative; overflow: hidden; border-bottom: 1px solid #e5e7eb; background: #fff; }
  .session .actions { position: absolute; top: 0; right: 0; bottom: 0; display: flex; z-index: 1; }
  .session .actions button { width: 72px; border: 0; color: #fff; font-size: 13px; padding: 0; }
  .session .actions .rename { background: #2563eb; }

  /* 底部弹层（重命名/删除确认） */

  .sheet input {

  .sheet .btn-cancel { background: #f1f5f9; color: #334155; }
  .sheet .btn-ok { background: #2563eb; color: #fff; }

  .model-list { max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .model-item {
    display: flex; align-items: center; gap: 8px; padding: 12px 8px;

  }

  .model-item:active { background: #f1f5f9; }

  .model-item .check { margin-left: auto; color: #2563eb; font-weight: 700; visibility: hidden; }

  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));

    max-width: 80%; text-align: center;
  }

  /* 新建对话页：参考桌面端 NewChatView 的居中问候 + 卡片式输入框 */
  #composeView { background: #f8fafc; }

    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto;

  .nc-hero { text-align: center; margin-bottom: 22px; }
  .nc-mark { font-size: 54px; line-height: 1; opacity: 0.18; }
  .nc-greet { margin: 10px 0 0; font-size: 20px; font-weight: 500; color: #111827; letter-spacing: .01em; }
  .nc-card {
    width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;

  }
  .nc-card:focus-within { border-color: #2563eb; }
  .nc-top { padding: 10px 12px 0; display: flex; align-items: center; gap: 4px; }
  .nc-pick-wrap { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #6b7280; }
  .nc-pick {
    appearance: none; -webkit-appearance: none; border: 0; background: transparent;

  }
  .nc-pick:focus { color: #111827; }
  .nc-textarea {
    width: 100%; border: 0; outline: none; resize: none; background: transparent;

  }
  .nc-textarea::placeholder { color: #9ca3af; }
  .nc-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px 10px; }
  .nc-sp { flex: 1; }
  .nc-send {
    width: 36px; height: 36px; border: 0; border-radius: 50%; background: #2563eb; color: #fff;

  }
  .nc-send:disabled { opacity: .4; }
  #composeStatus { min-height: 16px; margin-top: 10px; text-align: center; font-size: 12px; color: #64748b; }

  /* 笔记库：左侧树面板（项目条 + 搜索 + 可展开目录树）+ 右侧全屏阅读器。
     打开文件后树面板收起到左侧，露出把手；顶部 ☰ 或把手随时唤回（不关闭文件）。 */
  .notes-main {
    flex: 1; display: flex; position: relative; overflow: hidden; min-height: 0; background: #fff;
  }
  .notes-pane {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 2;
    width: 100%; max-width: 560px;
    display: flex; flex-direction: column; background: #fff; min-height: 0;
    transition: transform .25s ease;
  }
  .notes-pane.collapsed { transform: translateX(-100%); }
  .notes-proj-bar {
    display: flex; gap: 8px; padding: 10px 14px 4px;
    background: #fff; flex-shrink: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .notes-proj-bar::-webkit-scrollbar { display: none; }
  .notes-chip {
    flex-shrink: 0; border: 0; border-radius: 14px; background: #f1f5f9;
    color: #475569; font-size: 13px; padding: 5px 12px; font-family: inherit;
    max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .notes-chip.active { background: #2563eb; color: #fff; }
  .notes-query { padding: 8px 14px 10px; background: #fff; flex-shrink: 0; }
  .notes-query input {
    width: 100%; height: 38px; border: 1px solid #d1d5db; border-radius: 10px;
    padding: 0 12px; font-size: 14px; outline: none; font-family: inherit; background: #f8fafc;
  }
  .notes-query input:focus { border-color: #2563eb; background: #fff; }
  #notesList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; }
  .notes-row {
    display: flex; align-items: center; gap: 8px; position: relative; user-select: none;
    border-bottom: 1px solid #f1f5f9; background: #fff;
  }
  .notes-row.info-row { padding: 11px 14px; }
  .notes-row.sub-row { padding: 11px 12px 11px 12px; }
  .notes-row:active { background: #f1f5f9; }
  .notes-row .icon { width: 24px; flex-shrink: 0; font-size: 15px; text-align: center; }
  .notes-row .name { font-size: 14.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .notes-row .name .ext { font-size: 11px; color: #9ca3af; margin-left: 4px; }
  .notes-row .sub { font-size: 11px; color: #9ca3af; flex-shrink: 0; }
  .notes-row .arrow { width: 14px; flex-shrink: 0; font-size: 10px; color: #94a3b8; transition: transform .18s ease; display: inline-block; }
  .notes-row .arrow.open { transform: rotate(90deg); }
  .notes-row .count { font-size: 10.5px; color: #9ca3af; flex-shrink: 0; min-width: 40px; text-align: right; }
  .notes-children { display: none; background: #fbfcfe; }
  .notes-children.open { display: block; }

  /* 阅读器：打开文件时占满右侧全屏，顶部为阅读栏（‹ 关闭 | 文件名 | ☰ 唤回树） */
  #notesReader {
    flex: 1 1 auto; overflow: hidden;

  }
  .reader-hdr {

  }

  #readerBody {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;

  .reader-plain {

  .notes-handle {

<body>

<!-- 配对 -->
<div id="pairView" class="screen active">
  <div class="pair-box">
    <h1>启航AI工作台</h1>
    <p>在桌面端「设置 → 移动端」开启网关并点击「生成配对码」，然后在这里输入。</p>
    <div class="field">
      <label>设备名称</label>
      <input id="nameInput" type="text" maxlength="40" placeholder="我的手机">
    </div>
    <div class="field">
      <label>6 位配对码</label>
      <input id="codeInput" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••">
    </div>
    <button id="pairBtn" class="btn">配对并进入</button>
    <div id="pairError" class="pair-error"></div>
  </div>
</div>

<!-- 会话列表 -->
<div id="listView" class="screen">
  <div class="topbar">
    <div class="title">对话</div>
  </div>
  <div id="ptrIndicator"><span class="ptr-spinner"></span><span id="ptrText">下拉刷新</span></div>
  <div id="sessionList"></div>
  <button id="newChatBtn" class="fab">+</button>
</div>

<!-- 聊天 -->
<div id="chatView" class="screen">
  <div class="topbar">
    <button id="backBtn" class="icon-btn">‹</button>
    <div id="chatTitle" class="title">对话</div>
  </div>
  <button id="backBtnFloat" class="float-back">‹</button>
  <div id="messages"></div>
  <div id="statusLine"></div>
  <div id="pendingStrip" class="pending-strip hidden"></div>
  <div class="model-bar">
    <button id="modelBtn" class="model-chip" type="button">默认模型 ▾</button>
  </div>
  <div class="composer">
    <button id="imgBtn" class="img-btn" type="button">📷</button>
    <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
    <button id="sendBtn" class="send" disabled>发送</button>
    <input id="imgInput" type="file" accept="image/*" multiple hidden>
  </div>
</div>

<!-- 新建对话（独立页面）：参考桌面端布局，选项目/模型 + 首条消息，发送后才创建会话 -->
<div id="composeView" class="screen">
  <div class="topbar">
    <button id="composeBackBtn" class="icon-btn">‹</button>
    <div class="title">新建对话</div>
  </div>
  <button id="composeBackBtnFloat" class="float-back">‹</button>

    </div>

      <div class="nc-top">
        <span class="nc-pick-wrap">📁
          <select id="projectSelect" class="nc-pick"></select>
        </span>
      </div>

      <div class="nc-bar">
        <span class="nc-pick-wrap">
          <select id="modelSelect" class="nc-pick"></select>
        </span>
        <span class="nc-sp"></span>
        <button id="composeSendBtn" class="nc-send" disabled>↑</button>
      </div>
    </div>
    <div id="composeStatus"></div>
  </div>
</div>

<!-- 笔记库：左树面板（项目条 + 搜索 + 目录树，文件夹点按原地展开）+ 右全屏阅读器 -->
<div id="notesView" class="screen">

    <button id="notesBackBtn" class="icon-btn">‹</button>

      <div id="notesList"></div>

      <div class="reader-hdr">
        <button id="readerCloseBtn" class="icon-btn" type="button" title="关闭笔记">‹</button>
        <div class="reader-title" id="readerTitle">笔记</div>
        <button id="readerToggleBtn" class="icon-btn" type="button" title="展开/收起笔记树">☰</button>
      </div>
      <div id="readerBody"></div>
    </div>
  </div>
  <div id="notesHandle" class="notes-handle" title="唤出笔记树">☰</div>
</div>

<!-- 首页：今天页移动版（昨日简报 / 等你处理 / AI 工具动态 / 最近活跃会话 / 工作日志） -->
<div id="homeView" class="screen">

    <div class="title">首页</div>
  </div>
  <div class="home-body">
    <div id="homeDate" class="home-date"></div>
    <div class="sec"><div class="sec-t">📋 昨日简报<em id="homeBriefMeta"></em><span id="homeBriefRefresh" class="sec-act">⟳</span></div>
      <div class="home-card"><div id="homeBrief"></div></div>
    </div>

      <div class="home-card"><div id="homeSessions"></div></div>
    </div>

      <div class="home-card"><div id="homeFiles"></div></div>

<!-- 雷达会话详情（只读）：用户消息右对齐气泡，助手消息合并成块，思考过程折叠 -->

  // ---------- Markdown ----------
  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // 精简 sanitizer：去脚本类标签、on* 事件与 javascript:/非图片 data: 协议
  function sanitizeHtml(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var bad = doc.body.querySelectorAll('script,iframe,object,embed,style,link,meta,base,form');
    for (var i = 0; i < bad.length; i++) bad[i].remove();
    var all = doc.body.querySelectorAll('*');
    for (var j = 0; j < all.length; j++) {
      var el = all[j];
      var attrs = [].slice.call(el.attributes);
      for (var k = 0; k < attrs.length; k++) {
        var name = attrs[k].name.toLowerCase();
        var value = String(attrs[k].value || '').trim().toLowerCase();
        if (name.indexOf('on') === 0) { el.removeAttribute(attrs[k].name); continue; }
        if ((name === 'href' || name === 'src') &&
            (value.indexOf('javascript:') === 0 || (value.indexOf('data:') === 0 && value.indexOf('data:image/') !== 0))) {
          el.removeAttribute(attrs[k].name);
        }
      }
    }
    return doc.body.innerHTML;
  }

  function mdRender(text) {
    var html;
    try {
      html = typeof marked !== 'undefined'
        ? marked.parse(String(text), { breaks: true, gfm: true })
        : escHtml(String(text)).replace(/\n/g, '<br>');
    } catch (e) {
      html = escHtml(String(text));
    }
    return sanitizeHtml(html);
  }

  function decorateCode(container) {
    var pres = container.querySelectorAll('pre');
    for (var i = 0; i < pres.length; i++) {
      if (pres[i].querySelector('.copy-btn')) continue;
      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.type = 'button';
      btn.textContent = '复制';
      pres[i].appendChild(btn);
    }
  }

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { /* 老内核可能失败 */ }
    ta.remove();
  }

  function copyText(text, cb) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(cb, function () { fallbackCopy(text, cb); });
    } else {
      fallbackCopy(text, cb);
    }
  }

  messagesEl.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.copy-btn') : null;
    if (!btn) return;
    var pre = btn.parentNode;
    var code = pre.querySelector('code');
    copyText(((code || pre).innerText || '').replace(/\n$/, ''), function () {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1200);
    });
  });

  function show(view) {
    [pairView, listView, chatView, composeView, notesView, radarView, homeView].forEach(function (el) { el.classList.remove('active'); });
    view.classList.add('active');
    // 底部导航只在四个主屏（首页 / 会话列表 / 问雷达 / 笔记库）常驻；聊天/新建/配对页隐藏
    var onRoot = (view === homeView || view === listView || view === notesView || view === radarView);
    tabBar.classList.toggle('hidden', !onRoot);
    tabHome.classList.toggle('active', view === homeView);
    tabList.classList.toggle('active', view === listView);
    tabRadar.classList.toggle('active', view === radarView);
    tabNotes.classList.toggle('active', view === notesView);
    // 回到对话列表视为已读：清掉未读角标
    if (view === listView && state.unread) {
      state.unread = 0;
      renderTabBadge();
    }
  }

  // 进入聊天/新建页时压一条浏览器历史：Android app 返回手势/按键触发 webView.goBack()
  // → popstate → 回列表页；已在列表/配对页时无历史可退，由 app 正常退出
  function pushScreen(screen) {
    history.pushState({ screen: screen }, '', location.href);
  }
  window.addEventListener('popstate', function () {
    // 雷达会话详情返回回首页，其余子页回对话列表
    if (rdView.classList.contains('active')) show(homeView);
    else { show(listView); loadSessions(); }
  });
  // 从 bfcache 恢复时 DOM 是导航离开那一刻的冻结快照，可能与当前代码/状态不一致
  // （曾出现笔记 tab 高亮却显示新建对话页的脏快照）；强制重载拿一份一致的新文档。
  // persisted 仅在 bfcache 恢复时为 true，正常重载为 false，不会造成循环重载。
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) location.reload();
  });

  // 页内返回钮：有历史则走 history.back()（保持历史栈一致），否则直接回列表
  function backToList() {
    if (history.state && history.state.screen) history.back();
    else { show(listView); loadSessions(); }
  }

  // ---------- 接口 ----------
  function request(path, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers || {});
    if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
    return fetch(path, Object.assign({}, options, { headers: headers })).then(function (res) {
      if (res.status === 401) {
        logout();
        throw new Error('未配对或凭证已失效');
      }
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ('请求失败 ' + res.status));
        return data;
      });
    });
  }

  function postJson(path, body) {
    return request(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
  }

  function logout() {
    state.token = '';
    localStorage.removeItem(TOKEN_KEY);
    state.stopped = true;
    if (state.reconnectTimer) clearTimeout(state.reconnectTimer);
    show(pairView);
  }

  // ---------- 配对 ----------
  document.getElementById('pairBtn').addEventListener('click', function () {
    var code = document.getElementById('codeInput').value.replace(/[^\d]/g, '');
    var name = document.getElementById('nameInput').value.trim() || '手机';
    if (!/^\d{6}$/.test(code)) {
      pairErrorEl.textContent = '请输入 6 位数字配对码';
      return;
    }
    var btn = document.getElementById('pairBtn');
    btn.disabled = true;
    pairErrorEl.textContent = '';
    fetch('/api/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, name: name })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok || !data.token) throw new Error(data.error || '配对失败');
        state.token = data.token;
        state.name = name;
        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(NAME_KEY, name);
        enterApp();
      });
    }).catch(function (e) {
      pairErrorEl.textContent = e.message || '配对失败';
    }).finally(function () {
      btn.disabled = false;
    });
  });

  // 配对码输入时只保留数字，并清掉上一次的错误提示
  document.getElementById('codeInput').addEventListener('input', function () {
    this.value = this.value.replace(/[^\d]/g, '');
    pairErrorEl.textContent = '';
  });

  function enterApp() {
    state.stopped = false;
    enterHome();
    loadSessions();
    loadProjects();
    connectEvents();
  }

  // ---------- 会话 ----------
  var cachedProjects = [];

  function loadProjects() {
    return request('/api/projects').then(function (data) {
      cachedProjects = data.projects || [];
      renderSessions();
    }).catch(function () {});
  }

  function projectNameOf(session) {
    if (session.projectId === null || session.projectId === undefined) return '';
    var hit = cachedProjects.filter(function (p) { return Number(p.id) === Number(session.projectId); })[0];
    return hit ? hit.name : ('项目 ' + session.projectId);
  }
  var SESSIONS_PAGE_SIZE = 20;

  // 首屏/下拉刷新：重置到第一页
  function loadSessions() {
    state.sessionsRefreshing = true;
    ptrText.textContent = '刷新中…';
    ptrIndicator.classList.add('refreshing');
    return request('/api/sessions?limit=' + SESSIONS_PAGE_SIZE + '&offset=0').then(function (data) {
      state.sessions = data.sessions || [];
      state.sessionsHasMore = !!data.hasMore;
      renderSessions();
    }).catch(function () {}).then(function () {
      state.sessionsRefreshing = false;
      ptrIndicator.classList.remove('refreshing');
      setPull(0);
    });
  }

  // 上拉翻页：从已加载条数处继续取
  function loadMoreSessions() {
    if (state.sessionsLoadingMore || state.sessionsRefreshing || !state.sessionsHasMore) return;
    state.sessionsLoadingMore = true;
    renderSessions();
    request('/api/sessions?limit=' + SESSIONS_PAGE_SIZE + '&offset=' + state.sessions.length).then(function (data) {
      var more = data.sessions || [];
      state.sessions = state.sessions.concat(more);
      state.sessionsHasMore = !!data.hasMore && more.length > 0;
      renderSessions();
    }).catch(function () {}).then(function () {
      state.sessionsLoadingMore = false;
      renderSessions();
    });
  }

  // ---------- 下拉刷新手势 ----------
  var PTR_THRESHOLD = 60;
  var ptr = { startY: 0, pulling: false, dist: 0 };

  function setPull(px) {
    ptrIndicator.style.transition = px > 0 ? 'none' : '';
    ptrIndicator.style.transform = 'translateY(' + px + 'px)';
  }

  sessionListEl.addEventListener('touchstart', function (e) {
    if (sessionListEl.scrollTop <= 0 && !state.sessionsRefreshing) {
      ptr.startY = e.touches[0].clientY;
      ptr.pulling = true;
      ptr.dist = 0;
    }
  }, { passive: true });

  sessionListEl.addEventListener('touchmove', function (e) {
    if (!ptr.pulling) return;
    var d = e.touches[0].clientY - ptr.startY;
    if (d <= 0) {
      ptr.dist = 0;
      setPull(0);
      ptrText.textContent = '下拉刷新';
      return;
    }
    // 阻尼：越拉越费劲，最多 110px
    ptr.dist = Math.min(d * 0.5, 110);
    setPull(ptr.dist);
    ptrText.textContent = ptr.dist >= PTR_THRESHOLD ? '松开刷新' : '下拉刷新';
  }, { passive: true });

  function ptrRelease() {
    if (!ptr.pulling) return;
    ptr.pulling = false;
    if (ptr.dist >= PTR_THRESHOLD) {
      setPull(44);
      loadSessions();
    } else {
      setPull(0);
    }
    ptr.dist = 0;
  }
  sessionListEl.addEventListener('touchend', ptrRelease);
  sessionListEl.addEventListener('touchcancel', ptrRelease);

  // 滚动到底部附近自动加载下一页
  sessionListEl.addEventListener('scroll', function () {
    if (!state.sessionsHasMore || state.sessionsLoadingMore || state.sessionsRefreshing) return;
    if (sessionListEl.scrollTop + sessionListEl.clientHeight >= sessionListEl.scrollHeight - 200) {
      loadMoreSessions();
    }
  });

  function timeLabel(value) {
    if (!value) return '';
    var raw = String(value).replace(' ', 'T');
    var d = new Date(raw);
    if (isNaN(d.getTime())) return String(value).slice(5, 16);
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    var now = new Date();
    if (d.toDateString() === now.toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  var ACTION_W = 144; // 重命名 + 删除两个按钮的宽度
  var openSessionItem = null; // 当前左滑展开的 .session

  function closeOpenSwipe() {
    if (openSessionItem) {
      openSessionItem.querySelector('.session-main').style.transform = '';
      openSessionItem.classList.remove('open');
      openSessionItem = null;
    }
  }

  function attachSwipe(item, main, session) {
    var startX = 0, startY = 0, axis = null, pos = 0;

    main.addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      axis = null;
      pos = item.classList.contains('open') ? -ACTION_W : 0;
    }, { passive: true });

    main.addEventListener('touchmove', function (e) {
      var dx = e.touches[0].clientX - startX;
      var dy = e.touches[0].clientY - startY;
      if (axis === null) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        if (axis === 'x') {
          closeOpenSwipe();
          main.classList.add('swiping');
        }
      }
      if (axis !== 'x') return;
      pos = Math.max(-ACTION_W, Math.min(0, (item.classList.contains('open') ? -ACTION_W : 0) + dx));
      main.style.transform = 'translateX(' + pos + 'px)';
    }, { passive: true });

    function finish() {
      if (axis !== 'x') return;
      main.classList.remove('swiping');
      var shouldOpen = pos < -ACTION_W / 2;
      main.style.transform = shouldOpen ? 'translateX(-' + ACTION_W + 'px)' : '';
      item.classList.toggle('open', shouldOpen);
      openSessionItem = shouldOpen ? item : null;
    }
    main.addEventListener('touchend', finish);
    main.addEventListener('touchcancel', finish);

    main.addEventListener('click', function () {
      if (axis === 'x') { axis = null; return; } // 刚完成滑动，不当作点击
      if (item.classList.contains('open')) { closeOpenSwipe(); return; }
      openSession(session.sessionId, session.title, false, session.modelId);
    });
  }

  function renderSessions() {
    sessionListEl.innerHTML = '';
    openSessionItem = null;
    if (!state.sessions.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '还没有对话，点右下角「+」开始。';
      sessionListEl.appendChild(empty);
      return;
    }
    state.sessions.forEach(function (s) {
      var item = document.createElement('div');
      item.className = 'session';

      var actions = document.createElement('div');
      actions.className = 'actions';
      var renameBtn = document.createElement('button');
      renameBtn.className = 'rename';
      renameBtn.textContent = '重命名';
      var delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.textContent = '删除';
      actions.appendChild(renameBtn);
      actions.appendChild(delBtn);

      var main = document.createElement('div');
      main.className = 'session-main';
      var row1 = document.createElement('div');
      row1.className = 'row1';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = s.title || '新对话';
      var time = document.createElement('div');
      time.className = 'time';
      time.textContent = timeLabel(s.updatedAt);
      row1.appendChild(name);
      row1.appendChild(time);
      if (s.source) {
        var tag = document.createElement('span');
        tag.className = 'tag' + (s.source === 'mobile' ? ' mobile' : '');
        tag.textContent = s.source === 'mobile' ? '手机' : (s.source === 'feishu' ? '飞书' : '桌面');
        row1.appendChild(tag);
      }
      var meta = document.createElement('div');
      meta.className = 'meta';
      var projName = projectNameOf(s);
      if (projName) {
        var proj = document.createElement('span');
        proj.className = 'proj';
        proj.textContent = '📁 ' + projName;
        meta.appendChild(proj);
      }
      var preview = document.createElement('div');
      preview.className = 'preview';
      preview.textContent = (s.lastMessage || '').replace(/\s+/g, ' ').slice(0, 60) || '暂无消息';
      meta.appendChild(preview);
      main.appendChild(row1);
      main.appendChild(meta);

      item.appendChild(actions);
      item.appendChild(main);
      renameBtn.addEventListener('click', function () { openRenameSheet(s); });
      delBtn.addEventListener('click', function () { openDeleteSheet(s); });
      attachSwipe(item, main, s);
      sessionListEl.appendChild(item);
    });
    if (state.sessionsLoadingMore) {
      var more = document.createElement('div');
      more.className = 'load-more';
      more.textContent = '加载中…';
      sessionListEl.appendChild(more);
    } else if (!state.sessionsHasMore && state.sessions.length > SESSIONS_PAGE_SIZE) {
      var end = document.createElement('div');
      end.className = 'load-more';
      end.textContent = '没有更多了';
      sessionListEl.appendChild(end);
    }
  }

  // ---------- 会话重命名 / 删除 ----------
  var sheetMode = '';
  var sheetSession = null;

  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1800);
  }

  function openRenameSheet(s) {
    closeOpenSwipe();
    sheetMode = 'rename';
    sheetSession = s;
    sheetTitle.textContent = '重命名对话';
    sheetInput.classList.remove('hidden');
    sheetInput.value = s.title || '';
    sheetOk.textContent = '保存';
    sheetOk.classList.remove('danger');
    sheetMask.classList.add('show');
    setTimeout(function () { sheetInput.focus(); }, 60);
  }

  function openDeleteSheet(s) {
    closeOpenSwipe();
    sheetMode = 'delete';
    sheetSession = s;
    sheetTitle.textContent = '删除这条对话？';
    sheetInput.classList.add('hidden');
    sheetOk.textContent = '删除';
    sheetOk.classList.add('danger');
    sheetMask.classList.add('show');
  }

  function closeSheet() {
    sheetMask.classList.remove('show');
    sheetSession = null;
    sheetMode = '';
  }

  function submitSheet() {
    if (!sheetSession) return;
    var sid = sheetSession.sessionId;
    if (sheetMode === 'rename') {
      var title = sheetInput.value.trim();
      if (!title) return;
      closeSheet();
      request('/api/sessions/' + encodeURIComponent(sid), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title })
      }).then(function (data) {
        if (data.session) {
          state.sessions.forEach(function (x) { if (x.sessionId === sid) x.title = data.session.title; });

  // ---------- 图片发送 ----------
  var MAX_PENDING_IMAGES = 4;
  var pendingImages = [];

  imgBtn.addEventListener('click', function () { imgInput.click(); });

  // 有些安卓选图器返回的 file.type 为空：退回按扩展名判断，MIME 兜底 jpeg
  function isImageFile(file) {
    if (file.type && file.type.indexOf('image/') === 0) return true;
    return /\.(png|jpe?g|gif|webp|bmp|heic|heif)$/i.test(file.name || '');
  }

  function handleImageFile(file) {
    if (!file) return;
    if (!isImageFile(file)) { toast('请选择图片文件'); return; }
    if (pendingImages.length >= MAX_PENDING_IMAGES) { toast('一次最多带 ' + MAX_PENDING_IMAGES + ' 张图'); return; }
    compressImage(file, function (img) {
      if (!img || !img.data) { toast('图片处理失败，请换一张试试'); return; }
      pendingImages.push(img);
      renderPending();
      updateSendState();
    });
  }

  imgInput.addEventListener('change', function () {
    var files = [].slice.call(imgInput.files || []);
    imgInput.value = '';
    files.forEach(handleImageFile);
  });

  // 部分内嵌 WebView 不支持 <input type=file> 弹选择器：支持长按粘贴图片（截图/复制的图）
  [inputEl, document.getElementById('messages')].forEach(function (el) {
    el.addEventListener('paste', function (e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      var picked = false;
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
          var f = items[i].getAsFile();
          if (f) { handleImageFile(f); picked = true; }
        }
      }
      if (picked) e.preventDefault();
    });
  });

  // 压到最长边 1600、JPEG 0.85，控制 base64 体积；解码/画布失败时退回原图 base64
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onerror = function () { cb(null); };
    reader.onload = function (e) {
      var dataUrl = String(e.target.result || '');
      if (!dataUrl) { cb(null); return; }
      var img = new Image();
      img.onload = function () {
        try {
          var MAX = 1600;
          var scale = Math.min(1, MAX / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          var out = canvas.toDataURL('image/jpeg', 0.85);
          cb({ data: out.split(',')[1] || '', mimeType: 'image/jpeg' });
        } catch (err) {
          // 画布异常（老内核/内存不足）：退回原图，MIME 兜底 jpeg
          cb({ data: dataUrl.split(',')[1] || '', mimeType: file.type || 'image/jpeg' });
        }
      };
      img.onerror = function () {
        cb({ data: dataUrl.split(',')[1] || '', mimeType: file.type || 'image/jpeg' });
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  }

  function renderPending() {
    pendingStrip.innerHTML = '';
    if (!pendingImages.length) {
      pendingStrip.classList.add('hidden');
      return;
    }
    pendingStrip.classList.remove('hidden');
    pendingImages.forEach(function (img, i) {
      var wrap = document.createElement('div');
      wrap.className = 'pending';

      rm.type = 'button';
      rm.textContent = '×';
      rm.addEventListener('click', function () {

  function sendMessage() {
    var text = inputEl.value.trim();
    var images = pendingImages.map(function (img) { return { data: img.data, mimeType: img.mimeType }; });
    if ((!text && !images.length) || !state.current || state.streaming) return;
    var sid = state.current;
